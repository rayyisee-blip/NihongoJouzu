<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日々の学習 — Nihongo Daily</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#223A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nihongo Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (email/password login + cross-device sync). Inert until FIREBASE_CONFIG
     below is filled in with your own project's keys — see the setup guide. -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<body>
<div class="wrap">
  <header>
    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 170 58">
        <defs>
          <g id="bloom">
            <circle cx="0" cy="-2.6" r="2.1"/>
            <circle cx="2.4" cy="-.9" r="2.1"/>
            <circle cx="1.5" cy="2.1" r="2.1"/>
            <circle cx="-1.5" cy="2.1" r="2.1"/>
            <circle cx="-2.4" cy="-.9" r="2.1"/>
          </g>
        </defs>
        <path d="M164,2 C150,10 142,6 134,14 C127,21 137,20 130,28" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
        <path d="M142,10 C131,13 126,6 116,10" fill="none" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
        <use href="#bloom" x="164" y="2" fill="var(--vermillion-soft)" opacity=".85"/>
        <use href="#bloom" x="134" y="14" fill="var(--vermillion-soft)" opacity=".8" transform="rotate(15 134 14)"/>
        <use href="#bloom" x="116" y="10" fill="var(--gold)" opacity=".5" transform="scale(.8)"/>
        <use href="#bloom" x="130" y="28" fill="var(--vermillion-soft)" opacity=".65" transform="scale(.8)"/>
        <g transform="translate(28,4)"><path class="petal petal-1" d="M0,0 C1.9,-1.6 1.9,-4.8 0,-6.3 C-1.9,-4.8 -1.9,-1.6 0,0 Z" fill="var(--vermillion-soft)"/></g>
        <g transform="translate(64,0)"><path class="petal petal-2" d="M0,0 C1.9,-1.6 1.9,-4.8 0,-6.3 C-1.9,-4.8 -1.9,-1.6 0,0 Z" fill="var(--vermillion-soft)"/></g>
        <g transform="translate(98,6)"><path class="petal petal-3" d="M0,0 C1.9,-1.6 1.9,-4.8 0,-6.3 C-1.9,-4.8 -1.9,-1.6 0,0 Z" fill="var(--vermillion-soft)"/></g>
        <g transform="translate(150,20)"><path class="petal petal-4" d="M0,0 C1.9,-1.6 1.9,-4.8 0,-6.3 C-1.9,-4.8 -1.9,-1.6 0,0 Z" fill="var(--vermillion-soft)"/></g>
      </svg>
    </div>
    <div>
      <div class="eyebrow">Minna no Nihongo I &middot; Daily Practice</div>
      <h1>日々の学習<span style="font-size:14px; font-weight:500; color:var(--ink-soft); margin-left:6px;">（ひびのがくしゅう）</span><small>NIHONGO DAILY</small></h1>
    </div>
    <div class="streak-badge">STREAK<b id="streakNum">0</b>days</div>
  </header>

  <div class="brush-divider" aria-hidden="true">
    <svg viewBox="0 0 600 14" preserveAspectRatio="none">
      <path d="M0,7 C60,1 120,13 190,6 C260,0 320,13 390,5 C450,-1 510,12 570,4 C585,2 600,6 600,6 C600,8 600,9 600,9 C585,11 570,7 510,13 C450,19 390,6 320,14 C260,21 190,7 120,15 C60,22 0,13 0,10 Z"/>
    </svg>
  </div>

  <div id="authBar"></div>

  <nav class="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="lessons">Lessons</button>
    <button data-tab="grammar">Grammar</button>
    <button data-tab="conjugate">Conjugate</button>
    <button data-tab="textbook">N5 Textbook</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="notes">Notes</button>
  </nav>

  <main id="main"></main>

  <div class="fuji-scene" aria-hidden="true">
    <svg viewBox="0 0 600 90" preserveAspectRatio="none">
      <circle cx="300" cy="44" r="32" fill="var(--vermillion)" opacity=".15"/>
      <path d="M50,88 L170,42 L270,88 Z" fill="var(--indigo-2)" opacity=".07"/>
      <path d="M330,88 L440,40 L560,88 Z" fill="var(--indigo-2)" opacity=".07"/>
      <path d="M150,88 L292,16 L297,9 L301,9 L306,16 L448,88 Z" fill="var(--indigo)" opacity=".13"/>
    </svg>
  </div>
  <div class="wave-divider" aria-hidden="true"></div>
  <footer id="storageFooter">ONE PAGE, YOUR STORY 訳 &middot; CHECKING STORAGE&hellip;</footer>
</div>

<script>
/* ============================================================
   SAFETY NET — if anything anywhere throws an uncaught error before
   the app finishes loading, show a visible message instead of a
   silent blank page.
   ============================================================ */
window.addEventListener('error', function(ev){
  const mainEl = document.getElementById('main');
  if(mainEl && !mainEl.dataset.loaded){
    mainEl.innerHTML = `
      <div style="border:1.5px solid #BF3B30; padding:20px; font-family:sans-serif;">
        <strong>The app hit an error while loading:</strong>
        <p style="margin:10px 0; color:#5b544c;">${ev.message || 'Unknown error'}</p>
        <p style="margin:0; color:#5b544c; font-size:13px;">Open your browser's console (F12 → Console tab) for the full details, or check the FIREBASE_CONFIG values against the setup guide.</p>
      </div>
    `;
  }
});
</script>
<script src="js/lessons-data.js"></script>
<script src="js/reference-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/conjugation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
