<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日々の学習 — Nihongo Daily</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#223A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nihongo Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (email/password login + cross-device sync). Inert until FIREBASE_CONFIG
     below is filled in with your own project's keys — see the setup guide. -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  :root{
    --paper:#F6F1E4;
    --paper-2:#EFE7D3;
    --ink:#262220;
    --ink-soft:#5b544c;
    --indigo:#223A5E;
    --indigo-2:#3C5A82;
    --vermillion:#BF3B30;
    --vermillion-soft:#e2b3ac;
    --gold:#C99A3B;
    --line:#DCD3BE;
    --success:#5C7A5A;
    --success-soft:#e1e9df;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:32px;
    margin:0;
    line-height:1.1;
    letter-spacing:.02em;
  }
  h1 small{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-top:5px;
  }
  .streak-badge{
    font-family:'JetBrains Mono',monospace;
    text-align:right;
    font-size:12px;
    color:var(--ink-soft);
  }
  .streak-badge b{
    display:block;
    font-family:'Shippori Mincho', serif;
    font-size:26px;
    color:var(--vermillion);
    line-height:1;
  }

  /* ---------- Account / sync bar ---------- */
  .authbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 12px;
    margin-bottom:18px;
    background:var(--paper-2);
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .authbar b{color:var(--indigo); font-weight:600;}
  .authbar button.linklike{
    background:none; border:none; cursor:pointer;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.05em;
    color:var(--vermillion); text-decoration:underline;
    padding:0;
  }
  .authcard{margin-bottom:20px;}
  .authtabs{display:flex; gap:16px; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .authtabs button{
    background:none; border:none; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    padding:8px 2px; color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  .authtabs button.active{color:var(--ink); border-bottom-color:var(--vermillion); font-weight:600;}
  .authfield{margin-bottom:12px;}
  .authfield label{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.05em;}
  .authfield input{
    width:100%; font-family:'Zen Kaku Gothic New',sans-serif; font-size:15px;
    border:1.5px solid var(--ink); background:var(--paper); padding:10px 12px;
  }
  .autherror{color:var(--vermillion); font-size:13px; margin:10px 0 0;}
  .authnote{color:var(--ink-soft); font-size:12px; margin-top:12px;}

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    gap:2px;
    margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s;
  }
  nav.tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--vermillion);
    font-weight:600;
  }
  nav.tabs button:hover{color:var(--ink);}

  /* ---------- Cards ---------- */
  .card{
    background:var(--paper);
    border:1.5px solid var(--ink);
    padding:24px;
    margin-bottom:20px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .card-inner{position:relative;}

  .section-title{
    font-family:'Shippori Mincho', serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 6px;
  }
  .muted{color:var(--ink-soft); font-size:14px;}

  /* ---------- Stamp card (signature element) ---------- */
  .stampcard{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:18px 0 6px;
  }
  .stamp{
    width:40px;height:40px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-size:11px;
    font-weight:800;
    flex-shrink:0;
  }
  .stamp.filled{
    border:2.5px solid var(--vermillion);
    color:var(--vermillion);
    transform:rotate(-6deg);
    box-shadow:inset 0 0 0 2px rgba(191,59,48,.08);
    animation:stampland .35s ease-out;
  }
  .stamp.empty{
    border:1.5px dashed var(--line);
    color:var(--line);
  }
  @keyframes stampland{
    0%{transform:rotate(-6deg) scale(1.9); opacity:0;}
    60%{transform:rotate(-6deg) scale(0.92); opacity:1;}
    100%{transform:rotate(-6deg) scale(1);}
  }

  /* ---------- Buttons ---------- */
  button.primary{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:.06em;
    background:var(--indigo);
    color:var(--paper);
    border:none;
    padding:13px 22px;
    cursor:pointer;
    text-transform:uppercase;
    transition:background .15s;
  }
  button.primary:hover{background:var(--indigo-2);}
  button.ghost{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:none;
    border:1.5px solid var(--ink);
    color:var(--ink);
    padding:10px 16px;
    cursor:pointer;
    letter-spacing:.05em;
  }
  button.ghost:hover{background:var(--ink); color:var(--paper);}
  button:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Progress dots ---------- */
  .dots{display:flex; gap:6px; margin:14px 0;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dot.done{background:var(--indigo);}
  .dot.wrong{background:var(--vermillion);}

  /* ---------- Question ---------- */
  .qmeta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .qprompt{
    font-size:22px;
    font-weight:700;
    margin:0 0 20px;
    line-height:1.5;
  }
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice{
    text-align:left;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px;
    background:var(--paper);
    border:1.5px solid var(--ink);
    padding:13px 16px;
    cursor:pointer;
    transition:.12s;
  }
  .choice:hover{background:var(--paper-2);}
  .choice.correct{
    background:var(--success-soft);
    border-color:var(--success);
    color:var(--success);
    font-weight:700;
  }
  .choice.incorrect{
    background:#f3dcd9;
    border-color:var(--vermillion);
    color:var(--vermillion);
    font-weight:700;
  }
  .choice[disabled]{cursor:default;}
  .feedback-note{
    margin-top:16px;
    padding:12px 14px;
    background:var(--paper-2);
    border-left:3px solid var(--gold);
    font-size:14px;
    color:var(--ink-soft);
  }
  .nextbar{margin-top:20px; display:flex; justify-content:flex-end;}

  /* ---------- Lessons list ---------- */
  .lesson-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .lesson-row:last-child{border-bottom:none;}
  .lesson-num{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    font-weight:800;
    width:34px;
    color:var(--ink-soft);
  }
  .lesson-row.unlocked .lesson-num{color:var(--indigo);}
  .lesson-row.done .lesson-num{color:var(--vermillion);}
  .lesson-title{flex:1;}
  .lesson-title b{display:block; font-size:15px;}
  .lesson-title span{font-size:12px; color:var(--ink-soft);}
  .lesson-status{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:4px 8px;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }
  .lesson-status.avail{border-color:var(--indigo); color:var(--indigo);}
  .lesson-status.done{border-color:var(--vermillion); color:var(--vermillion);}

  /* ---------- Capstone ---------- */
  .en-sentence{
    font-family:'Shippori Mincho', serif;
    font-style:italic;
    font-size:19px;
    margin:0 0 14px;
    line-height:1.5;
  }
  textarea{
    width:100%;
    min-height:80px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:18px;
    border:1.5px solid var(--ink);
    background:var(--paper);
    padding:12px;
    resize:vertical;
  }
  .model-answer{
    margin-top:16px;
    padding:16px;
    background:var(--paper-2);
    border-left:3px solid var(--indigo);
  }
  .model-answer .jp{font-size:20px; font-weight:700; margin-bottom:6px;}
  .model-answer .note{font-size:13px; color:var(--ink-soft);}
  .selfgrade{display:flex; gap:10px; margin-top:16px;}

  /* ---------- Stats ---------- */
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;}
  .statbox{border:1px solid var(--line); padding:14px;}
  .statbox .num{font-family:'Shippori Mincho',serif; font-size:28px; font-weight:800; color:var(--indigo);}
  .statbox .lbl{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.06em;}
  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
  .barrow .lname{width:80px; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:11px;}
  .barwrap{flex:1; height:8px; background:var(--paper-2); border:1px solid var(--line);}
  .barfill{height:100%; background:var(--indigo);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state .glyph{font-family:'Shippori Mincho',serif; font-size:40px; color:var(--vermillion); margin-bottom:10px;}

  /* ---------- Grammar tab ---------- */
  .gstruct{border-bottom:1px solid var(--line); padding:14px 0;}
  .gstruct:last-child{border-bottom:none;}
  .gstruct-title{font-family:'Shippori Mincho',serif; font-weight:700; font-size:16px;}
  .gexample{background:var(--paper-2); border-left:3px solid var(--indigo); padding:10px 12px; margin-top:8px;}
  .gexample-jp{font-size:16px; font-weight:600; margin-bottom:3px;}
  .gexample-en{font-size:13px; color:var(--ink-soft); font-style:italic;}
  .gexample-note{font-size:12px; color:var(--ink-soft); margin-top:6px; border-top:1px dashed var(--line); padding-top:6px;}
  .particle-list{margin-top:6px;}
  .particle-row{border-bottom:1px solid var(--line);}
  .particle-row:last-child{border-bottom:none;}
  .particle-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    padding:14px 4px;
    cursor:pointer;
    text-align:left;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .particle-char{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:22px;
    color:var(--indigo);
    width:38px;
    flex-shrink:0;
  }
  .particle-role{flex:1; font-size:14px;}
  .particle-level{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--vermillion);
    border:1px solid var(--vermillion-soft);
    padding:2px 6px;
    flex-shrink:0;
  }
  .particle-caret{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    color:var(--ink-soft);
    width:16px;
    text-align:center;
    flex-shrink:0;
  }
  .particle-body{padding:0 4px 16px;}
  .gpattern{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:var(--paper-2);
    border:1px dashed var(--line);
    padding:8px 10px;
    margin-bottom:10px;
    color:var(--indigo-2);
  }

  /* ---------- N5 Textbook tab ---------- */
  .tb-lesson{border-bottom:1px solid var(--line);}
  .tb-lesson:last-child{border-bottom:none;}
  .tb-lesson-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    background:none;
    border:none;
    padding:14px 4px;
    cursor:pointer;
    text-align:left;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .tb-lesson-num{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:22px;
    color:var(--indigo);
    width:34px;
    flex-shrink:0;
  }
  .tb-lesson-title-wrap{flex:1;}
  .tb-lesson-title-wrap b{display:block; font-size:15px;}
  .tb-lesson-title-wrap span{font-size:12px; color:var(--ink-soft);}
  .tb-lesson-body{padding:4px 4px 20px;}
  .tb-section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--vermillion);
    border-bottom:1px solid var(--vermillion-soft);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .tb-vocab-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 18px;
  }
  .tb-vocab-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px dotted var(--line);
    font-size:14px;
  }
  .tb-vocab-jp{font-weight:600; flex-shrink:0;}
  .tb-vocab-en{color:var(--ink-soft); text-align:right; font-size:13px;}
  .tb-pattern{margin-bottom:16px;}
  .tb-pattern-title{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:16px;
  }

  footer{text-align:center; margin-top:40px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.05em;}

  @media (max-width:480px){
    h1{font-size:26px;}
    .qprompt{font-size:19px;}
    .statgrid{grid-template-columns:1fr;}
    .tb-vocab-list{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Minna no Nihongo I &middot; Daily Practice</div>
      <h1>日々の学習<span style="font-size:14px; font-weight:500; color:var(--ink-soft); margin-left:6px;">（ひびのがくしゅう）</span><small>NIHONGO DAILY</small></h1>
    </div>
    <div class="streak-badge">STREAK<b id="streakNum">0</b>days</div>
  </header>

  <div id="authBar"></div>

  <nav class="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="lessons">Lessons</button>
    <button data-tab="grammar">Grammar</button>
    <button data-tab="conjugate">Conjugate</button>
    <button data-tab="textbook">N5 Textbook</button>
    <button data-tab="stats">Stats</button>
  </nav>

  <main id="main"></main>

  <footer id="storageFooter">ONE PAGE, YOUR STORY 訳 &middot; CHECKING STORAGE&hellip;</footer>
</div>

<script>
/* ============================================================
   SAFETY NET — if anything anywhere throws an uncaught error before
   the app finishes loading, show a visible message instead of a
   silent blank page.
   ============================================================ */
window.addEventListener('error', function(ev){
  const mainEl = document.getElementById('main');
  if(mainEl && !mainEl.dataset.loaded){
    mainEl.innerHTML = `
      <div style="border:1.5px solid #BF3B30; padding:20px; font-family:sans-serif;">
        <strong>The app hit an error while loading:</strong>
        <p style="margin:10px 0; color:#5b544c;">${ev.message || 'Unknown error'}</p>
        <p style="margin:0; color:#5b544c; font-size:13px;">Open your browser's console (F12 → Console tab) for the full details, or check the FIREBASE_CONFIG values against the setup guide.</p>
      </div>
    `;
  }
});

/* ============================================================
   DATA — 25 lessons, each with quiz questions + capstone lines
   ============================================================ */
const LESSONS = [
{n:1,title:"これ・それ・あれ / です",topic:"Identifying things, basic です sentences",
 q:[
  {type:"vocab",prompt:"How do you say \"this (thing, near me)\" in Japanese?",choices:["これ","それ","あれ","どれ"],a:0,note:"これ = this (near speaker). それ = that (near listener). あれ = that over there (far from both)."},
  {type:"vocab",prompt:"「学生（がくせい）」means:",choices:["Teacher","Student","Company employee","Doctor"],a:1,note:"学生（がくせい）= student."},
  {type:"grammar",prompt:"これ ___ 辞書（じしょ）です。(This is a dictionary.)",choices:["は","を","に","で"],a:0,note:"は marks the topic. 'これは辞書（じしょ）です' = As for this, it is a dictionary."},
  {type:"structure",prompt:"Choose the correct question form of 'Is that a book?'",choices:["それは 本（ほん）です か。","それは 本（ほん）ですか。","それ 本（ほん）は ですか。","それ は 本（ほん） か です。"],a:1,note:"Add か directly after です, no extra space needed: それは本（ほん）ですか。"}
 ],
 cap:[
  {en:"This is a dictionary.",jp:"これは 辞書（じしょ）です。",note:"これ + は + noun + です for simple identification."},
  {en:"Is that your umbrella?",jp:"それは あなたの 傘（かさ）ですか。",note:"あなたの = your; の links possessor and noun."},
  {en:"That is a magazine.",jp:"それは 雑誌（ざっし）です。",note:"Same これ／それ／あれ + です pattern as the other sentences here, just with a different demonstrative and noun."}
 ]},
{n:2,title:"この／その／あの + N",topic:"Demonstrative adjectives, prices",
 q:[
  {type:"vocab",prompt:"「傘（かさ）」means:",choices:["Umbrella","Book","Watch","Bag"],a:0,note:"傘（かさ）= umbrella."},
  {type:"vocab",prompt:"How do you ask \"How much is it?\"",choices:["これは 何（なに）ですか。","いくらですか。","どこですか。","誰（だれ）のですか。"],a:1,note:"いくら = how much (price)."},
  {type:"grammar",prompt:"___ 本（ほん）は 私（わたし）のです。(That book [near you] is mine.)",choices:["この","その","あの","どの"],a:1,note:"その + noun = that (near listener). Contrast with それ, which stands alone."},
  {type:"structure",prompt:"Which is correctly formed: \"Whose bag is this?\"",choices:["これは 誰（だれ）の かばんですか。","これ 誰（だれ）は かばんですか。","誰（だれ）の これは かばんですか。","これは かばん 誰（だれ）のですか。"],a:0,note:"誰（だれ）の (whose) + noun comes right before です."}
 ],
 cap:[
  {en:"This pen is 500 yen.",jp:"この ペンは 500円（えん）です。",note:"この + noun for 'this ___', then price + です."},
  {en:"Whose dictionary is that (over there)?",jp:"あれは 誰（だれ）の 辞書（じしょ）ですか。",note:"あれ stands alone (no noun follows) since it means 'that thing over there'."},
  {en:"This car isn't mine.",jp:"この 車（くるま）は 私（わたし）のじゃありません。",note:"Negative of です for nouns: 〜じゃありません (casual, same weight as 〜ではありません)."}
 ]},
{n:3,title:"ここ・そこ・あそこ / どこ",topic:"Places, N1のN2, asking origin",
 q:[
  {type:"vocab",prompt:"「デパート」means:",choices:["Station","Department store","Hospital","School"],a:1,note:"デパート = department store (loanword)."},

// Two possible save destinations depending on where this file is running:
//  - "cloud": Claude.ai's built-in artifact storage (window.storage) — works when
//             this file is opened/rendered inside a Claude.ai conversation.
//  - "local": the browser's own localStorage — works when this .html file is
//             downloaded and opened directly (double-clicked, file://, or hosted).
// We detect which is available at load time and use that one consistently.
let STORAGE_MODE = 'none';

function detectStorageMode(){
  if(FIREBASE_READY && fbUser){
    return 'firebase';
  }
  if(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function'){
    return 'cloud';
  }
  try{
    const testKey = '__nihongo_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return 'local';
  }catch(e){
    return 'none';
  }
}

function defaultProgress(){
  return {
    currentLesson: 1,
    seen: {},              // qKey -> {count, correct}
    dailyLog: {},           // date -> {qids:[], completed:bool}
    capstoneStatus: {},     // lessonNum -> 'locked'|'available'|'done'
    capstoneResults: {},    // lessonNum -> {sentenceIdx: 'good'|'retry'}
    reviewCapstoneStatus: {}, // block (5/10/15/20/25) -> 'available'|'done'
    capstoneRequeue: [],    // sentences marked "needs more work", resurfaced later
    streak: 0,
    lastCompletedDate: null,
    totalStamps: 0,
    stampDates: []
  };
}

async function loadProgress(){
  STORAGE_MODE = detectStorageMode();
  let loaded = null;
  try{
    if(STORAGE_MODE === 'firebase'){
      const snap = await fbDb.collection('progress').doc(fbUser.uid).get();
      loaded = (snap.exists && snap.data().payload) ? JSON.parse(snap.data().payload) : null;
    } else if(STORAGE_MODE === 'cloud'){
      const res = await window.storage.get(STORE_KEY, false);
      loaded = (res && res.value) ? JSON.parse(res.value) : null;
    } else if(STORAGE_MODE === 'local'){
      const raw = window.localStorage.getItem(STORE_KEY);
      loaded = raw ? JSON.parse(raw) : null;
    }
  }catch(e){
    // Read failed — fall back to a local safety-net copy if one exists,
    // so a backend hiccup doesn't look like lost progress.
    try{
      const raw = window.localStorage.getItem(STORE_KEY + '-safetynet');
      loaded = raw ? JSON.parse(raw) : null;
    }catch(e2){ /* no safety net available either */ }
  }
  PROGRESS = loaded || defaultProgress();
  if(!PROGRESS.capstoneStatus[1]) PROGRESS.capstoneStatus[1] = 'locked';
  if(!PROGRESS.reviewCapstoneStatus) PROGRESS.reviewCapstoneStatus = {};
  if(!PROGRESS.capstoneRequeue) PROGRESS.capstoneRequeue = [];
}

let SAVE_STATUS = 'ok'; // 'ok' | 'retrying' | 'fallback'

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function saveProgress(){
  const payload = JSON.stringify(PROGRESS);

  // Always keep a silent local safety-net copy, regardless of primary storage
  // mode, so a transient server error never risks losing a session's progress.
  try{ window.localStorage.setItem(STORE_KEY + '-safetynet', payload); }catch(e){ /* ignore */ }

  if(STORAGE_MODE === 'firebase'){
    for(let attempt=1; attempt<=2; attempt++){
      try{
        await fbDb.collection('progress').doc(fbUser.uid).set({payload, updatedAt: Date.now()});
        SAVE_STATUS = 'ok';
        updateSaveStatusUI();
        return;
      }catch(e){
        if(attempt===1){
          await wait(600);
        } else {
          console.warn('Sync temporarily unavailable, kept locally instead', e);
          SAVE_STATUS = 'fallback';
          updateSaveStatusUI();
        }
      }
    }
    return;
  }

  if(STORAGE_MODE === 'local'){
    try{
      window.localStorage.setItem(STORE_KEY, payload);
      SAVE_STATUS = 'ok';
    }catch(e){
      console.warn('Local save failed', e);
      SAVE_STATUS = 'fallback';
    }
    updateSaveStatusUI();
    return;
  }

  if(STORAGE_MODE === 'cloud'){
    for(let attempt=1; attempt<=2; attempt++){
      try{
        await window.storage.set(STORE_KEY, payload, false);
        SAVE_STATUS = 'ok';
        updateSaveStatusUI();
        return;
      }catch(e){
        if(attempt===1){
          await wait(600);
        } else {
          // Both attempts failed — likely a transient backend issue. Progress is
          // still safe in the local safety-net copy above; just let the person
          // know saving is temporarily delayed rather than showing a raw error.
          console.warn('Cloud save temporarily unavailable, kept locally instead', e);
          SAVE_STATUS = 'fallback';
          updateSaveStatusUI();
        }
      }
    }
    return;
  }
  // STORAGE_MODE 'none' — nothing persistent available; already safety-netted above if possible.
}

function updateSaveStatusUI(){
  const footer = document.getElementById('storageFooter');
  if(!footer) return;
  if(SAVE_STATUS === 'fallback'){
    footer.innerHTML = `ONE PAGE, YOUR STORY 訳 &middot; SYNC DELAYED &mdash; KEPT SAFE LOCALLY, WILL RETRY`;
  } else {
    const msg = STORAGE_MODE==='firebase' ? `SYNCED TO YOUR ACCOUNT (${fbUser.email})`
      : STORAGE_MODE==='cloud' ? 'PROGRESS SAVES TO YOUR CLAUDE.AI ACCOUNT'
      : STORAGE_MODE==='local' ? 'PROGRESS SAVES TO THIS BROWSER ONLY'
      : 'STORAGE UNAVAILABLE &mdash; PROGRESS WON\u2019T PERSIST';
    footer.innerHTML = `ONE PAGE, YOUR STORY 訳 &middot; ${msg}`;
  }
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(typeof parsed !== 'object' || parsed===null) throw new Error('Invalid file');
      PROGRESS = Object.assign(defaultProgress(), parsed);
      await saveProgress();
      render();

  reader.readAsText(file);

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function dateSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function shuffle(arr, rand){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* ============================================================
   QUESTION GENERATION — turns the N5 Textbook's vocab and sentence
   patterns into many more quiz question *variants* than the 4 hand-
   written questions per lesson alone. Each generated question has a
   stable id (for spaced-repetition tracking), but its multiple-choice
   options are freshly sampled each time it's displayed, so the same
   underlying question doesn't look identical on repeat exposure.
   ============================================================ */
function allVocabUpTo(lessonNum){
  const out = [];
  TEXTBOOK.filter(t=>t.n<=lessonNum).forEach(t=> out.push(...t.vocab));
  return out;
}
function allExamplesUpTo(lessonNum){
  const out = [];
  TEXTBOOK.filter(t=>t.n<=lessonNum).forEach(t=> t.patterns.forEach(p=> p.examples.forEach(ex=> out.push({...ex, patternTitle:p.title}))));
  return out;
}
function allPatternTitlesUpTo(lessonNum, excludeTitle){
  const out = [];
  TEXTBOOK.filter(t=>t.n<=lessonNum).forEach(t=> t.patterns.forEach(p=>{ if(p.title!==excludeTitle) out.push(p.title); }));
  return out;
}
function sampleN(arr, n){
  return shuffle(arr, Math.random).slice(0, n);
}

// One lightweight record per generated question: just enough to look the
// content back up later. Built once at load for all 25 lessons.
function buildGeneratedPool(lessonNum){
  const tb = TEXTBOOK.find(t=>t.n===lessonNum);
  const items = [];
  if(!tb) return items;
  tb.vocab.forEach((v,i)=>{
    items.push({ qid:`gen-venjp-${lessonNum}-${i}`, lesson:lessonNum, kind:'vocab_en_jp', vocabIdx:i });
    items.push({ qid:`gen-vjpen-${lessonNum}-${i}`, lesson:lessonNum, kind:'vocab_jp_en', vocabIdx:i });
  });
  tb.patterns.forEach((p,pi)=>{
    p.examples.forEach((ex,ei)=>{
      items.push({ qid:`gen-senjp-${lessonNum}-${pi}-${ei}`, lesson:lessonNum, kind:'sentence_en_jp', patternIdx:pi, exampleIdx:ei });
    });
    items.push({ qid:`gen-precog-${lessonNum}-${pi}`, lesson:lessonNum, kind:'pattern_recognize', patternIdx:pi });
  });
  return items;
}

const GENERATED_POOL_BY_LESSON = {};
const GENERATED_INDEX = {};
LESSONS.forEach(l=>{
  const items = buildGeneratedPool(l.n);
  GENERATED_POOL_BY_LESSON[l.n] = items;
  items.forEach(it=> GENERATED_INDEX[it.qid] = it);
});

// ----------------------------------------------------------------
// MUTATION-BASED DISTRACTORS — instead of grabbing random unrelated
// vocab/sentences (which gives away the answer by script, length, or
// topic alone), build wrong options that are *close* to the answer:
// same script + similar length for vocab, same-lesson topic plus a
// word-order scramble and a particle swap for sentences.
// ----------------------------------------------------------------
function scriptOf(str){
  return (/[゠-ヿ]/.test(str) && !/[一-鿿]/.test(str)) ? 'kata' : 'other';
}
function visibleLen(str){
  return str.replace(/（.*?）/g,'').length;
}
function buildVocabDistractors(pool, answer, key){
  const ansStr = answer[key];
  const ansScript = scriptOf(ansStr);
  const ansLen = visibleLen(ansStr);
  let candidates = pool.filter(x => scriptOf(x[key]) === ansScript);
  if(candidates.length < 3) candidates = pool.slice();
  candidates = candidates
    .map(x => ({x, d: Math.abs(visibleLen(x[key]) - ansLen)}))
    .sort((a,b) => a.d - b.d)
    .map(o => o.x);
  const nearBand = candidates.slice(0, Math.max(6, Math.min(candidates.length, 10)));
  return shuffle(nearBand, Math.random).slice(0,3).map(x => x[key]);
}
const PARTICLE_SWAP_SET = ['は','が','を','に','で','へ','と','も'];
// Only swaps the kana that ends a space-separated phrase chunk — that's
// where a particle actually sits in these example sentences. Scanning the
// raw string for the first matching character instead would happily grab
// one buried mid-word (e.g. the は inside ごはん) and corrupt the vocabulary
// instead of testing the particle.
function particleSwapVariant(jp){
  const chunks = jp.split(' ');
  for(let i=0;i<chunks.length;i++){
    let chunk = chunks[i];
    let trailingPunct = '';
    if(/[。、]$/.test(chunk)){ trailingPunct = chunk.slice(-1); chunk = chunk.slice(0,-1); }
    if(!chunk) continue;
    const last = chunk.slice(-1);
    if(PARTICLE_SWAP_SET.includes(last)){
      const alt = PARTICLE_SWAP_SET.filter(x => x!==last);
      const swap = alt[Math.floor(Math.random()*alt.length)];
      const next = chunks.slice();
      next[i] = chunk.slice(0,-1) + swap + trailingPunct;
      return next.join(' ');
    }
  }
  return null;
}
function scrambleVariant(jp){
  const chunks = jp.split(' ').filter(Boolean);
  if(chunks.length < 3) return null;
  const shuffled = shuffle(chunks, Math.random);
  const joined = shuffled.join(' ');
  return joined === jp ? null : joined;
}
function buildSentenceDistractors(item, ex, tb){
  const sameLessonPool = tb.patterns.flatMap(p => p.examples).filter(x => x.jp!==ex.jp).map(x => x.jp);
  let topicPool = sameLessonPool;
  if(topicPool.length < 3){
    const widened = [];
    for(let ln=Math.max(1,item.lesson-2); ln<=item.lesson; ln++){
      const t = TEXTBOOK.find(x=>x.n===ln);
      if(t) t.patterns.forEach(p=> p.examples.forEach(x=>{ if(x.jp!==ex.jp) widened.push(x.jp); }));
    }
    topicPool = widened.length >= 3 ? widened : allExamplesUpTo(item.lesson).filter(x=>x.jp!==ex.jp).map(x=>x.jp);
  }
  const mutated = [];
  const scr = scrambleVariant(ex.jp); if(scr) mutated.push(scr);
  const swap = particleSwapVariant(ex.jp); if(swap && swap!==ex.jp) mutated.push(swap);
  const shuffledTopicPool = shuffle(topicPool, Math.random);
  const combined = [];
  [...mutated, ...shuffledTopicPool].forEach(s => {
    if(s && s!==ex.jp && !combined.includes(s) && combined.length<3) combined.push(s);
  });
  return combined;
}

// Resolves a lightweight generated-question record into the same
// {prompt, choices, a, note, type, lesson, qid} shape the renderer already
// expects for static questions, sampling fresh distractors each call.
function resolveGeneratedQuestion(item){
  const tb = TEXTBOOK.find(t=>t.n===item.lesson);

  if(item.kind === 'vocab_en_jp'){
    const v = tb.vocab[item.vocabIdx];
    const pool = allVocabUpTo(item.lesson).filter(x=>x.jp!==v.jp);
    const distractors = buildVocabDistractors(pool, v, 'jp');
    const choices = shuffle([v.jp, ...distractors], Math.random);
    return { qid:item.qid, lesson:item.lesson, type:'vocab', prompt:`Which word means "${v.en}"?`, choices, a:choices.indexOf(v.jp), note:`${v.jp} = ${v.en}` };
  }
  if(item.kind === 'vocab_jp_en'){
    const v = tb.vocab[item.vocabIdx];
    const pool = allVocabUpTo(item.lesson).filter(x=>x.en!==v.en);
    const distractors = buildVocabDistractors(pool, v, 'en');
    const choices = shuffle([v.en, ...distractors], Math.random);
    return { qid:item.qid, lesson:item.lesson, type:'vocab', prompt:`「${v.jp}」means:`, choices, a:choices.indexOf(v.en), note:`${v.jp} = ${v.en}` };
  }
  if(item.kind === 'sentence_en_jp'){
    const p = tb.patterns[item.patternIdx];
    const ex = p.examples[item.exampleIdx];
    const distractors = buildSentenceDistractors(item, ex, tb);
    const choices = shuffle([ex.jp, ...distractors], Math.random);
    return { qid:item.qid, lesson:item.lesson, type:'structure', prompt:`Which sentence means: "${ex.en}"?`, choices, a:choices.indexOf(ex.jp), note:`${p.title} \u2014 ${p.explain}` };
  }
  if(item.kind === 'pattern_recognize'){
    const p = tb.patterns[item.patternIdx];
    const ex = p.examples[0];
    let distractorPool = tb.patterns.filter((_,idx)=>idx!==item.patternIdx).map(x=>x.title);
    if(distractorPool.length < 3){
      distractorPool = allPatternTitlesUpTo(item.lesson, p.title);
    }
    const distractors = sampleN(distractorPool, Math.min(3,distractorPool.length));
    const choices = shuffle([p.title, ...distractors], Math.random);
    return { qid:item.qid, lesson:item.lesson, type:'grammar', prompt:`Which grammar point does this sentence use?\n${ex.jp}`, choices, a:choices.indexOf(p.title), note:p.explain };
  }
  return null;
}

/* ============================================================
   CONJUGATION ENGINE — a real rules engine, not hand-written
   questions. Japanese verb conjugation is regular once you know
   the verb's group:
     Group 1 (godan/う-verbs):  書く, 飲む, 帰る
     Group 2 (ichidan/る-verbs): 食べる, 見る
     Group 3 (irregular):       する, 来る (+ noun+する compounds)
   Every verb below is tagged with its group, and one rule table
   per group produces every form. Distractors are built the same
   way real learners get it wrong: wrong verb-group rule, wrong
   godan branch, or right form/wrong tense-polarity.
   ============================================================ */
const VERBS = [
  // ---- Group 1 (godan) ----
  {dict:"書（か）く", stem:"書（か）", oku:"く", group:1, meaning:"to write"},
  {dict:"聞（き）く", stem:"聞（き）", oku:"く", group:1, meaning:"to listen, hear, ask"},
  {dict:"歩（ある）く", stem:"歩（ある）", oku:"く", group:1, meaning:"to walk"},
  {dict:"働（はたら）く", stem:"働（はたら）", oku:"く", group:1, meaning:"to work"},
  {dict:"泳（およ）ぐ", stem:"泳（およ）", oku:"ぐ", group:1, meaning:"to swim"},
  {dict:"飲（の）む", stem:"飲（の）", oku:"む", group:1, meaning:"to drink"},
  {dict:"読（よ）む", stem:"読（よ）", oku:"む", group:1, meaning:"to read"},
  {dict:"住（す）む", stem:"住（す）", oku:"む", group:1, meaning:"to live (somewhere)"},
  {dict:"死（し）ぬ", stem:"死（し）", oku:"ぬ", group:1, meaning:"to die"},
  {dict:"遊（あそ）ぶ", stem:"遊（あそ）", oku:"ぶ", group:1, meaning:"to play"},
  {dict:"話（はな）す", stem:"話（はな）", oku:"す", group:1, meaning:"to speak"},

const FORM_LABELS = {
  masuNeg: "polite negative (ません) form",
  masuPast: "polite past (ました) form",
  masuPastNeg: "polite past negative (ませんでした) form",
  te: "て-form",
  ta: "plain past (た-form)",
  nai: "plain negative (ない-form)",
  naiPast: "plain past negative (なかった-form)",
  dict: "dictionary form",
  potential: "potential form (“can do”)",
  volitional: "volitional form (“let's / shall”)",
  passive: "passive form",
  causative: "causative form"
};
const FORM_UNLOCK_LESSON = {
  masuNeg:1, masuPast:7, masuPastNeg:7, te:14, ta:14,
  nai:16, naiPast:16, dict:17, potential:17, volitional:19,
  passive:24, causative:25
};

const GODAN_ROWS = {
  'う':['わ','い','う','え','お'], 'く':['か','き','く','け','こ'],
  'ぐ':['が','ぎ','ぐ','げ','ご'], 'す':['さ','し','す','せ','そ'],
  'つ':['た','ち','つ','て','と'], 'ぬ':['な','に','ぬ','ね','の'],
  'ぶ':['ば','び','ぶ','べ','ぼ'], 'む':['ま','み','む','め','も'],
  'る':['ら','り','る','れ','ろ']
};
const TE_TA_MAP = {
  'う':{te:'って',ta:'った'}, 'つ':{te:'って',ta:'った'}, 'る':{te:'って',ta:'った'},
  'む':{te:'んで',ta:'んだ'}, 'ぶ':{te:'んで',ta:'んだ'}, 'ぬ':{te:'んで',ta:'んだ'},
  'く':{te:'いて',ta:'いた'}, 'ぐ':{te:'いで',ta:'いだ'}, 'す':{te:'して',ta:'した'}
};
function godanForms(oku){
  const last = oku.slice(-1), rest = oku.slice(0,-1);
  const row = GODAN_ROWS[last], teTa = TE_TA_MAP[last];
  return {
    dict: oku,
    masuNeg: rest+row[1]+'ません', masuPast: rest+row[1]+'ました', masuPastNeg: rest+row[1]+'ませんでした',
    te: rest+teTa.te, ta: rest+teTa.ta,
    nai: rest+row[0]+'ない', naiPast: rest+row[0]+'なかった',
    potential: rest+row[3]+'る', volitional: rest+row[4]+'う',
    passive: rest+row[0]+'れる', causative: rest+row[0]+'せる'
  };
}
function ichidanForms(oku){
  const rest = oku.slice(0,-1);
  return {
    dict: oku,
    masuNeg: rest+'ません', masuPast: rest+'ました', masuPastNeg: rest+'ませんでした',
    te: rest+'て', ta: rest+'た',
    nai: rest+'ない', naiPast: rest+'なかった',
    potential: rest+'られる', volitional: rest+'よう',
    passive: rest+'られる', causative: rest+'させる'
  };
}
const SURU_SUFFIX = {
  dict:'する', masuNeg:'しません', masuPast:'しました', masuPastNeg:'しませんでした',
  te:'して', ta:'した', nai:'しない', naiPast:'しなかった',
  potential:'できる', volitional:'しよう', passive:'される', causative:'させる'
};
const KURU_FORMS = {
  dict:'来（く）る', masuNeg:'来（き）ません', masuPast:'来（き）ました', masuPastNeg:'来（き）ませんでした',
  te:'来（き）て', ta:'来（き）た', nai:'来（こ）ない', naiPast:'来（こ）なかった',
  potential:'来（こ）られる', volitional:'来（こ）よう', passive:'来（こ）られる', causative:'来（こ）させる'
};
function computeForms(verb){
  if(verb.irregular==='kuru') return KURU_FORMS;
  if(verb.irregular==='suru'){
    const out = {};
    for(const k in SURU_SUFFIX) out[k] = (verb.stem||'') + SURU_SUFFIX[k];
    return out;
  }
  if(verb.group===2){
    const f = ichidanForms(verb.oku);
    const out = {}; for(const k in f) out[k] = (verb.stem||'') + f[k];
    return out;
  }
  const f = godanForms(verb.oku);
  if(verb.irregularTe){
    const rest = verb.oku.slice(0,-1);
    f.te = rest+'って'; f.ta = rest+'った';
  }
  const out = {}; for(const k in f) out[k] = (verb.stem||'') + f[k];
  return out;
}
function masuForm(verb){
  if(verb.irregular==='kuru') return '来（き）ます';
  if(verb.irregular==='suru') return (verb.stem||'')+'します';
  if(verb.group===2) return (verb.stem||'')+verb.oku.slice(0,-1)+'ます';
  const last = verb.oku.slice(-1), rest = verb.oku.slice(0,-1);
  return (verb.stem||'')+rest+GODAN_ROWS[last][1]+'ます';
}
// The most common real learner mistakes, generated the same way a person
// would actually make them — not random unrelated verbs.
function generateMistakes(verb, formKey){
  const out = [];
  const push = s => { if(s && !out.includes(s)) out.push(s); };
  const forms = computeForms(verb);
  const correct = forms[formKey];

  if(verb.group===1){
    const ic = ichidanForms(verb.oku);
    push((verb.stem||'')+ic[formKey]);
  } else if(verb.group===2){
    const go = godanForms(verb.oku);
    push((verb.stem||'')+go[formKey]);
  } else if(verb.irregular==='suru'){
    const go = godanForms('する');
    push((verb.stem||'')+go[formKey]);
  }

  if(verb.group===1 && (formKey==='te'||formKey==='ta')){
    const last = verb.oku.slice(-1);
    const rest = verb.oku.slice(0,-1);
    const altBranches = ['く','む','す','ぐ'].filter(b=>b!==last);
    shuffle(altBranches, Math.random).slice(0,2).forEach(b=>{
      const teTa = TE_TA_MAP[b];
      push((verb.stem||'')+rest+(formKey==='te'?teTa.te:teTa.ta));
    });
  }

  const masuFam = ['masuNeg','masuPast','masuPastNeg'];
  const plainFam = ['dict','nai','ta','naiPast'];
  const advFam = ['potential','volitional','passive','causative'];
  const fam = masuFam.includes(formKey) ? masuFam : plainFam.includes(formKey) ? plainFam : advFam.includes(formKey) ? advFam : null;
  if(fam) fam.filter(k=>k!==formKey).forEach(k=>push(forms[k]));

  return out.filter(s=>s && s!==correct);
}
function explainForm(verb, formKey){
  const groupLabel = verb.group===1 ? "Group 1 (godan/う-verb)" : verb.group===2 ? "Group 2 (ichidan/る-verb)" : "Group 3 (irregular)";
  let rule = '';
  if(verb.group===1){
    if(formKey==='te'||formKey==='ta') rule = "Godan て/た-form depends on the final kana: う・つ・る→って/った, む・ぶ・ぬ→んで/んだ, く→いて/いた, ぐ→いで/いだ, す→して/した.";
    else if(formKey==='nai'||formKey==='naiPast') rule = "Godan ない-form: change the final う-row kana to its あ-row equivalent, then add ない (う verbs take わ, not あ).";
    else if(formKey==='potential') rule = "Godan potential: change the final う-row kana to its え-row equivalent, then add る.";
    else if(formKey==='volitional') rule = "Godan volitional: change the final う-row kana to its お-row equivalent, then add う.";
    else if(formKey==='passive'||formKey==='causative') rule = "Godan passive/causative: change the final う-row kana to its あ-row equivalent, then add れる/せる.";
    if(verb.trap) rule += ` ${verb.dict} ends in る but is godan, not ichidan — a classic trap.`;
  } else if(verb.group===2){
    rule = "Ichidan verbs just drop る and add the ending directly — no branching by final kana.";
  } else if(verb.irregular==='suru'){
    rule = "する is irregular: します／して／した／しない, and its potential is the special form できる, not される-style.";
  } else if(verb.irregular==='kuru'){
    rule = "来る is irregular: the kanji 来 shifts reading between き (来ます／来て／来た) and こ (来ない／来よう／来られる).";
  }
  return `${groupLabel}. ${rule} Meaning: ${verb.meaning}.`.trim();
}
const CONJUGATION_POOL = [];
VERBS.forEach((v,vi)=>{
  Object.keys(FORM_LABELS).forEach(formKey=>{
    CONJUGATION_POOL.push({ qid:`conj-${vi}-${formKey}`, verbIdx:vi, formKey });
  });
});
function conjugationIdsUpTo(lessonNum){
  if(lessonNum < 14) return [];
  return CONJUGATION_POOL
    .filter(it => (FORM_UNLOCK_LESSON[it.formKey]||99) <= lessonNum)
    .map(it => it.qid);
}
function resolveConjugationQuestion(qid){
  const parts = qid.split('-');
  const verbIdx = Number(parts[1]);
  const formKey = parts.slice(2).join('-');
  const verb = VERBS[verbIdx];
  const forms = computeForms(verb);
  const given = masuForm(verb);
  const correct = forms[formKey];
  const mistakes = generateMistakes(verb, formKey);
  let distractors = mistakes.slice(0,3);
  if(distractors.length < 3){
    const otherVerbs = shuffle(VERBS.filter((v,i)=>i!==verbIdx), Math.random);
    for(const ov of otherVerbs){
      if(distractors.length>=3) break;
      const ovForm = computeForms(ov)[formKey];
      if(ovForm && ovForm!==correct && !distractors.includes(ovForm)) distractors.push(ovForm);
    }
  }
  const choices = shuffle([correct, ...distractors.slice(0,3)], Math.random);
  return {
    qid, lesson: 14, type:'conjugation',
    prompt: `What's the ${FORM_LABELS[formKey]} of ${given}?`,
    choices, a: choices.indexOf(correct),
    note: explainForm(verb, formKey)
  };
}

// Spaced repetition (Leitner-style): each question tracks a "box" 1-5.
// Wrong answer -> back to box 1 (resurfaces soon). Right answer -> box up
// to 5 (resurfaces less often). Selection weight favors low boxes and
// brand-new questions, without ever fully excluding mastered ones.
function boxWeight(qid){
  const rec = PROGRESS.seen[qid];
  if(!rec || rec.count===0) return 6;
  const box = rec.box || 1;
  return Math.max(1, 6-box);
}
function weightedSample(items, weightFn, count){
  const pool = items.slice();
  const picked = [];
  const n = Math.min(count, pool.length);
  for(let i=0;i<n;i++){
    const weights = pool.map(weightFn);
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    let idx = 0;
    for(; idx<weights.length-1; idx++){
      r -= weights[idx];
      if(r<=0) break;
    }
    picked.push(pool[idx]);
    pool.splice(idx,1);
  }
  return picked;
}

function allQuestionsUpTo(lessonNum){
  const out = [];
  for(let n=1;n<=lessonNum;n++){
    out.push(...lessonQuestionIds(n));
  }
  out.push(...conjugationIdsUpTo(lessonNum));
  return out;
}
function lessonQuestionIds(lessonNum){
  const l = LESSONS.find(x=>x.n===lessonNum);
  const staticIds = l.q.map((q,i)=> l.n+"-"+i);
  const genIds = (GENERATED_POOL_BY_LESSON[lessonNum]||[]).map(it=>it.qid);
  return [...staticIds, ...genIds];
}
// Capstone unlock stays gated on the 4 original hand-written questions only
// (not the full generated pool) so lesson pacing doesn't change - the
// generated questions add practice depth without slowing progression.
function lessonFullySeen(lessonNum){
  const l = LESSONS.find(x=>x.n===lessonNum);
  const staticIds = l.q.map((q,i)=> l.n+"-"+i);
  return staticIds.every(qid => PROGRESS.seen[qid] && PROGRESS.seen[qid].count>0);
}
function getTodaysSet(){
  const date = todayStr();
  if(PROGRESS.dailyLog[date]) return PROGRESS.dailyLog[date];
  const pool = allQuestionsUpTo(PROGRESS.currentLesson);
  const picked = weightedSample(pool, boxWeight, Math.min(12, pool.length));
  PROGRESS.dailyLog[date] = { qids: picked, answers:{}, completed:false };
  saveProgress();
  return PROGRESS.dailyLog[date];
}
function qByQid(qid){
  if(qid.indexOf('gen-') === 0){
    return resolveGeneratedQuestion(GENERATED_INDEX[qid]);
  }
  if(qid.indexOf('conj-') === 0){
    return resolveConjugationQuestion(qid);
  }
  const [lessonNum, idx] = qid.split("-").map(Number);
  const l = LESSONS.find(x=>x.n===lessonNum);
  return {...l.q[idx], lesson:lessonNum, qid};
}

// Builds an on-demand practice round for the current lesson, with no daily limit.
// Prioritizes questions from the current lesson not yet seen (so capstones unlock
// fast); once everything in the lesson has been seen at least once, it falls back
// to spaced-repetition weighting across the lesson's full pool (static + generated)
// so struggling questions resurface more than mastered ones.
function buildPracticeSet(){
  const cur = PROGRESS.currentLesson;
  const ids = lessonQuestionIds(cur);
  const unseen = ids.filter(qid => !PROGRESS.seen[qid] || PROGRESS.seen[qid].count===0);
  const pool = unseen.length>0 ? unseen : ids;
  return weightedSample(pool, boxWeight, pool.length);
}
function updateStreakOnComplete(){
  const date = todayStr();
  if(PROGRESS.lastCompletedDate === date) return;
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestStr = yest.getFullYear()+"-"+String(yest.getMonth()+1).padStart(2,'0')+"-"+String(yest.getDate()).padStart(2,'0');
  if(PROGRESS.lastCompletedDate === yestStr){
    PROGRESS.streak += 1;
  } else {
    PROGRESS.streak = 1;
  }
  PROGRESS.lastCompletedDate = date;
  if(!PROGRESS.stampDates.includes(date)){
    PROGRESS.stampDates.push(date);
    PROGRESS.totalStamps += 1;
  }
}
function checkLessonUnlocks(){
  const cur = PROGRESS.currentLesson;
  if(lessonFullySeen(cur) && (!PROGRESS.capstoneStatus[cur] || PROGRESS.capstoneStatus[cur]==='locked')){
    PROGRESS.capstoneStatus[cur] = 'available';
  }
}
function isCapstoneDone(lessonNum){
  return PROGRESS.capstoneStatus[lessonNum] === 'done';
}
function completeCapstone(lessonNum){
  PROGRESS.capstoneStatus[lessonNum] = 'done';
  if(REVIEW_CAPSTONES.some(rc=>rc.block===lessonNum) && !PROGRESS.reviewCapstoneStatus[lessonNum]){
    PROGRESS.reviewCapstoneStatus[lessonNum] = 'available';
  }
  if(lessonNum === PROGRESS.currentLesson && lessonNum < 25){
    PROGRESS.currentLesson = lessonNum + 1;
    if(!PROGRESS.capstoneStatus[lessonNum+1]) PROGRESS.capstoneStatus[lessonNum+1] = 'locked';
  }
}
// Sentences marked "needs more work" resurface later instead of disappearing.
function requeueSentence(sentence){
  if(!PROGRESS.capstoneRequeue.some(x=>x.jp===sentence.jp)){
    PROGRESS.capstoneRequeue.push({en:sentence.en, jp:sentence.jp, note:sentence.note, check:sentence.check||null});
  }
}

      <button class="primary" id="startReviewCapstoneBtn" data-block="${readyBlock.block}" style="margin-top:10px;">Begin Review</button>
    </div></div>`;
    })() }

    ${ PROGRESS.capstoneRequeue.length>0 ? `
    <div class="card"><div class="card-inner">
      <div class="section-title" style="font-size:17px;">Needs More Work (${PROGRESS.capstoneRequeue.length})</div>

      <button class="ghost" id="startRequeueBtn" style="margin-top:10px;">Review Them</button>
    </div></div>` : '' }

    ${ (PROGRESS.currentLesson>1 || Object.values(PROGRESS.capstoneStatus).some(s=>s==='done')) ? `
    <div class="card"><div class="card-inner">
      <div class="section-title" style="font-size:16px;">Progress</div>
      <p class="muted">Lessons completed: ${Object.values(PROGRESS.capstoneStatus).filter(s=>s==='done').length} / 25 &middot; Currently on Lesson ${PROGRESS.currentLesson}</p>
    </div></div>` : ''}
  `;

  const startBtn = document.getElementById('startQuizBtn');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    quizState = { qids: set.qids, idx: answeredCount, mode:'daily', answers:{} };
    renderQuizQuestion();
  });
  const practiceBtn = document.getElementById('practiceBtn');
  if(practiceBtn) practiceBtn.addEventListener('click', ()=>{
    quizState = { qids: buildPracticeSet(), idx: 0, mode:'practice', answers:{} };
    renderQuizQuestion();
  });
  const capBtn = document.getElementById('startCapstoneBtn');
  if(capBtn) capBtn.addEventListener('click', ()=> startLessonCapstone(PROGRESS.currentLesson));

  const reviewBtn = document.getElementById('startReviewCapstoneBtn');
  if(reviewBtn) reviewBtn.addEventListener('click', ()=> startReviewCapstone(Number(reviewBtn.dataset.block)));

  const requeueBtn = document.getElementById('startRequeueBtn');
  if(requeueBtn) requeueBtn.addEventListener('click', startRequeueCapstone);
}

function renderQuizQuestion(){
  const isDaily = quizState.mode === 'daily';
  const dailySet = isDaily ? PROGRESS.dailyLog[todayStr()] : null;

  if(quizState.idx >= quizState.qids.length){
    if(isDaily){
      dailySet.completed = true;
      updateStreakOnComplete();
    }
    checkLessonUnlocks();
    saveProgress();
    quizState = null;
    render();
    return;
  }
  const qid = quizState.qids[quizState.idx];
  const q = qByQid(qid);
  const alreadyAnswered = quizState.answers[qid];

  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="qmeta">${q.type==='conjugation' ? 'Conjugation Drill' : 'Lesson '+q.lesson} &middot; ${q.type} &middot; ${quizState.mode==='daily' ? 'Today\u2019s Quiz' : quizState.mode==='conjugation' ? 'Conjugation Drill' : 'Practice Round'} &middot; Question ${quizState.idx+1} of ${quizState.qids.length}</div>
      <p class="qprompt">${q.prompt}</p>
      <div class="choices" id="choicesWrap"></div>
      <div id="feedbackArea"></div>
      <div class="nextbar" id="nextBar" style="display:none;">
        <button class="primary" id="nextBtn">Next &rarr;</button>
      </div>
    </div></div>
  `;
  const wrap = document.getElementById('choicesWrap');
  q.choices.forEach((choiceText, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choiceText;
    btn.addEventListener('click', ()=> selectAnswer(qid, q, i));
    wrap.appendChild(btn);
  });

  if(alreadyAnswered){
    lockChoices(q, alreadyAnswered.picked);
  }
}

function selectAnswer(qid, q, pickedIdx){
  const isDaily = quizState.mode === 'daily';
  const correct = pickedIdx === q.a;
  quizState.answers[qid] = { picked: pickedIdx, correct };

  if(isDaily){
    const dailySet = PROGRESS.dailyLog[todayStr()];
    if(!dailySet.answers) dailySet.answers = {};
    dailySet.answers[qid] = { picked: pickedIdx, correct };
  }

  if(!PROGRESS.seen[qid]) PROGRESS.seen[qid] = {count:0, correct:0, box:1};
  const rec = PROGRESS.seen[qid];
  rec.count += 1;
  if(correct){
    rec.correct += 1;
    rec.box = Math.min(5, (rec.box||1) + 1);
  } else {
    rec.box = 1;
  }

  saveProgress();
  lockChoices(q, pickedIdx);
}

function lockChoices(q, pickedIdx){
  const wrap = document.getElementById('choicesWrap');
  Array.from(wrap.children).forEach((btn, i)=>{
    btn.disabled = true;
    if(i===q.a) btn.classList.add('correct');
    else if(i===pickedIdx) btn.classList.add('incorrect');
  });
  document.getElementById('feedbackArea').innerHTML = `<div class="feedback-note">${q.note}</div>`;
  document.getElementById('nextBar').style.display = 'flex';
  document.getElementById('nextBtn').onclick = ()=>{
    quizState.idx += 1;
    renderQuizQuestion();
  };
}

// capstoneState shapes:
//   {mode:'lesson',  lessonNum, idx, list: lesson.cap}
//   {mode:'review',  lessonNum: block, idx, list: reviewSet.cap}
//   {mode:'requeue', idx, list: snapshot of PROGRESS.capstoneRequeue}
function startLessonCapstone(lessonNum){
  const lesson = LESSONS.find(l=>l.n===lessonNum);
  capstoneState = { mode:'lesson', lessonNum, idx:0, list: lesson.cap };
  renderCapstone();
}
function startReviewCapstone(block){
  const rc = REVIEW_CAPSTONES.find(r=>r.block===block);
  capstoneState = { mode:'review', lessonNum: block, idx:0, list: rc.cap };
  renderCapstone();
}
function startRequeueCapstone(){
  capstoneState = { mode:'requeue', idx:0, list: PROGRESS.capstoneRequeue.slice() };
  renderCapstone();
}
function renderCapstone(){
  const sentence = capstoneState.list[capstoneState.idx];
  const isLast = capstoneState.idx === capstoneState.list.length - 1;
  const heading = capstoneState.mode==='lesson' ? `Lesson ${capstoneState.lessonNum} Capstone`
    : capstoneState.mode==='review' ? REVIEW_CAPSTONES.find(r=>r.block===capstoneState.lessonNum).title
    : 'Needs-Work Review';

  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="qmeta">${heading} &middot; ${capstoneState.idx+1} of ${capstoneState.list.length}</div>
      <p class="en-sentence">&ldquo;${sentence.en}&rdquo;</p>
      <textarea id="capInput" placeholder="Type your Japanese translation here..."></textarea>
      <div style="margin-top:14px;" id="capActionArea">
        <button class="primary" id="revealBtn">Show Model Answer</button>
      </div>
      <div id="capAnswerArea"></div>
    </div></div>
  `;

  document.getElementById('revealBtn').addEventListener('click', ()=>{
    const checkHtml = sentence.check ? `
      <div class="feedback-note" style="margin-top:12px;">
        <b>Check your answer for:</b>
        <ul style="margin:8px 0 0; padding-left:18px;">${sentence.check.map(c=>`<li style="margin-bottom:4px;">${c}</li>`).join('')}</ul>
      </div>` : '';
    document.getElementById('capAnswerArea').innerHTML = `
      <div class="model-answer">
        <div class="jp">${sentence.jp}</div>
        <div class="note">${sentence.note}</div>
      </div>
      ${checkHtml}
      <div class="selfgrade">
        <button class="ghost" id="gotItBtn">✓ Got it right</button>
        <button class="ghost" id="retryBtn">Needs more work</button>
      </div>
    `;
    document.getElementById('capActionArea').innerHTML = '';
    document.getElementById('gotItBtn').addEventListener('click', ()=> gradeCapstone(true));
    document.getElementById('retryBtn').addEventListener('click', ()=> gradeCapstone(false));
  });

  function gradeCapstone(good){
    if(capstoneState.mode==='lesson'){
      if(!PROGRESS.capstoneResults[capstoneState.lessonNum]) PROGRESS.capstoneResults[capstoneState.lessonNum] = {};
      PROGRESS.capstoneResults[capstoneState.lessonNum][capstoneState.idx] = good ? 'good' : 'retry';
      if(!good) requeueSentence(sentence);
    } else if(capstoneState.mode==='review'){
      if(!good) requeueSentence(sentence);
    } else if(capstoneState.mode==='requeue' && good){
      PROGRESS.capstoneRequeue = PROGRESS.capstoneRequeue.filter(x=>x.jp!==sentence.jp);
    }
    saveProgress();
    if(isLast){
      if(capstoneState.mode==='lesson') completeCapstone(capstoneState.lessonNum);
      else if(capstoneState.mode==='review') PROGRESS.reviewCapstoneStatus[capstoneState.lessonNum] = 'done';
      saveProgress();
      capstoneState = null;
      setTab('today');
    } else {
      capstoneState.idx += 1;
      renderCapstone();
    }
  }
}

function renderLessons(){
  let rows = '';
  LESSONS.forEach(l=>{
    const status = PROGRESS.capstoneStatus[l.n] || (l.n < PROGRESS.currentLesson ? 'done' : (l.n===PROGRESS.currentLesson ? 'locked' : 'locked'));
    let label = 'Locked', cls = '';
    if(status==='done'){ label='Complete'; cls='done'; }
    else if(status==='available'){ label='Capstone Ready'; cls='avail'; }
    else if(l.n===PROGRESS.currentLesson){ label='In Progress'; cls='avail'; }
    const rowCls = status==='done' ? 'done' : (l.n<=PROGRESS.currentLesson ? 'unlocked' : '');
    rows += `
      <div class="lesson-row ${rowCls}" data-lesson="${l.n}">
        <div class="lesson-num">${String(l.n).padStart(2,'0')}</div>
        <div class="lesson-title"><b>${l.title}</b><span>${l.topic}</span></div>
        <div class="lesson-status ${cls}">${label}</div>
      </div>
    `;
  });
  main.innerHTML = `<div class="card"><div class="card-inner">
    <div class="section-title">25 Lessons</div>
    <p class="muted">Tap an unlocked lesson to review its capstone.</p>
    ${rows}
  </div></div>`;

  document.querySelectorAll('.lesson-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const n = Number(row.dataset.lesson);
      const status = PROGRESS.capstoneStatus[n];
      if(status==='available' || status==='done'){
        activeTab = 'today';
        document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab==='today'));
        startLessonCapstone(n);
      }
    });
  });
}

function renderConjugate(){
  if(quizState){ renderQuizQuestion(); return; }

  const godanRowHtml = Object.keys(GODAN_ROWS).map(k=>{
    const row = GODAN_ROWS[k], teTa = TE_TA_MAP[k];
    return `<div class="barrow" style="font-family:'JetBrains Mono',monospace; font-size:12px;">
      <div class="lname" style="width:36px;">${k}〜</div>
      <div style="flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:4px;">
        <span>〜${row[1]}ます</span><span>〜${row[0]}ない</span><span>〜${teTa.te}</span><span>〜${teTa.ta}</span><span>〜${row[3]}る</span>
      </div>
    </div>`;
  }).join('');

  const seenConj = CONJUGATION_POOL.filter(it=>PROGRESS.seen[it.qid] && PROGRESS.seen[it.qid].count>0).length;

  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="section-title">Conjugation Drill</div>
      <p class="muted">Verb forms gate almost every grammar pattern from Lesson 14 onward. Drill any verb &times; any form here, independent of your lesson pace &mdash; wrong answers are the mistakes learners actually make (wrong verb-group rule, wrong godan branch, wrong tense), not random unrelated words.</p>
      <p class="muted" style="margin-top:10px; font-size:12px;">${VERBS.length} verbs &middot; ${Object.keys(FORM_LABELS).length} forms each &middot; ${seenConj}/${CONJUGATION_POOL.length} combinations practiced so far</p>
      <button class="primary" id="startConjDrillBtn" style="margin-top:14px;">Start Conjugation Drill</button>
    </div></div>

    <div class="card"><div class="card-inner">
      <div class="section-title" style="font-size:17px;">Reference &mdash; the three groups</div>
      <div class="gstruct">
        <div class="gstruct-title">Group 1 &mdash; godan / う-verbs</div>
        <p class="muted" style="margin:6px 0 10px;">Every form branches off the verb's final kana. This is the branch table &mdash; memorize the row, not each verb individually.</p>
        <div style="border:1px solid var(--line); padding:10px 12px; margin-top:6px;">${godanRowHtml}</div>
        <div class="gexample-note" style="margin-top:10px;">Watch for traps: 帰る・入る・要る・知る・走る all end in る but are godan, not ichidan &mdash; conjugate them off this table, not the Group 2 rule below.</div>
      </div>
      <div class="gstruct">
        <div class="gstruct-title">Group 2 &mdash; ichidan / る-verbs</div>
        <p class="muted" style="margin:6px 0 10px;">Drop る, then attach the ending directly &mdash; no branching. 食べる → 食べます・食べない・食べて・食べた・食べられる・食べよう.</p>
      </div>
      <div class="gstruct">
        <div class="gstruct-title">Group 3 &mdash; irregular</div>

      </div>

  document.getElementById('startConjDrillBtn').addEventListener('click', ()=>{
    const ids = weightedSample(CONJUGATION_POOL.map(it=>it.qid), boxWeight, Math.min(15, CONJUGATION_POOL.length));

}

      <div class="authtabs">
        <button data-mode="login" class="${authFormMode==='login'?'active':''}">Log In</button>
        <button data-mode="signup" class="${authFormMode==='signup'?'active':''}">Create Account</button>
      </div>
      <div class="authfield">
        <label>Email</label>
        <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="authfield">
        <label>Password</label>
        <input type="password" id="authPassword" autocomplete="${authFormMode==='signup'?'new-password':'current-password'}" placeholder="At least 6 characters">
      </div>
      ${authError ? `<p class="autherror">${authError}</p>` : ''}
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button class="primary" id="authSubmitBtn">${authBusy ? 'Please wait…' : (authFormMode==='login' ? 'Log In' : 'Create Account')}</button>
        <button class="ghost" id="authCancelBtn">Cancel</button>
      </div>
      <p class="authnote">Your account only unlocks sync for this quiz app &mdash; use any email and password you'll remember. There's no password recovery yet, so keep it somewhere safe.</p>
    </div></div>
  `;
  document.querySelectorAll('.authtabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ authFormMode = b.dataset.mode; authError=''; renderAuthBar(); });
  });
  document.getElementById('authCancelBtn').addEventListener('click', ()=>{ showAuthForm=false; authError=''; renderAuthBar(); });
  document.getElementById('authSubmitBtn').addEventListener('click', submitAuthForm);
}

async function submitAuthForm(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError = '';
  if(!email || !password){
    authError = 'Please fill in both fields.';
    renderAuthBar();
    return;
  }
  authBusy = true;
  renderAuthBar();
  try{
    if(authFormMode === 'signup'){
      await fbAuth.createUserWithEmailAndPassword(email, password);
    } else {
      await fbAuth.signInWithEmailAndPassword(email, password);
    }
    showAuthForm = false;
    authError = '';
    // onAuthStateChanged below picks up the new session, reloads progress, and re-renders.
  }catch(e){
    authError = friendlyAuthError(e);
  }
  authBusy = false;
  renderAuthBar();
}

function friendlyAuthError(e){
  const code = e && e.code ? e.code : '';
  if(code.includes('email-already-in-use')) return 'That email already has an account — try Log In instead.';
  if(code.includes('wrong-password') || code.includes('user-not-found') || code.includes('invalid-credential')) return 'Email or password not recognized.';
  if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(code.includes('invalid-email')) return 'That email address doesn\u2019t look right.';
  return 'Something went wrong — please try again.';
}

/* ============================================================
   INIT
   ============================================================ */
async function bootProgress(){
  await loadProgress();
  render();
  renderAuthBar();
  main.dataset.loaded = 'true';
}

function showFatalError(e){
  console.error('Nihongo Daily failed to load:', e);
  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="section-title">Couldn't load the app</div>
      <p class="muted" style="margin-top:8px;">${(e && e.message) ? e.message : 'An unexpected error occurred.'}</p>
      <p class="muted" style="margin-top:10px;">Try reloading the page. If this keeps happening, open your browser's developer console (F12 or right-click → Inspect → Console) for the full error, or double-check the FIREBASE_CONFIG values in the file against the setup guide.</p>
    </div></div>
  `;
}

async function init(){
  main.innerHTML = `<div class="empty-state"><div class="glyph">読</div>Loading your progress&hellip;</div>`;
  renderAuthBar();
  if(FIREBASE_READY){
    fbAuth.onAuthStateChanged(async (user)=>{
      try{
        fbUser = user;
        await bootProgress();
      }catch(e){
        showFatalError(e);
      }
    });
  } else {
    try{
      await bootProgress();
    }catch(e){
      showFatalError(e);
    }
  }
}
init();
</script>
</body>
</html>
