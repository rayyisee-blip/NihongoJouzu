<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日々の学習 — Nihongo Daily</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C513E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nihongo Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Firebase (email/password login + cross-device sync). Inert until FIREBASE_CONFIG
     below is filled in with your own project's keys — see the setup guide. -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">木</div>
      <h1>komorebi &middot; Japanese<span class="brand-sub">日々の学習 &middot; Nihongo Daily</span></h1>
    </div>
    <div class="streak-badge">STREAK<b id="streakNum">0</b>days</div>
  </header>

  <div id="authBar"></div>

  <nav class="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="lessons">Lessons</button>
    <button data-tab="grammar">Grammar</button>
    <button data-tab="conjugate">Conjugate</button>
    <button data-tab="textbook">N5 Textbook</button>
    <button data-tab="reading">Reading</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="notes">Notes</button>
  </nav>

  <main id="main"></main>

  <footer id="storageFooter">ONE PAGE, YOUR STORY 訳 &middot; CHECKING STORAGE&hellip;</footer>
</div>

<script>
/* ============================================================
   SAFETY NET — if anything anywhere throws an uncaught error before
   the app finishes loading, show a visible message instead of a
   silent blank page.
   ============================================================ */
window.addEventListener('error', function(ev){
  const mainEl = document.getElementById('main');
  if(mainEl && !mainEl.dataset.loaded){
    mainEl.innerHTML = `
      <div style="border:1.5px solid #BF3B30; padding:20px; font-family:sans-serif;">
        <strong>The app hit an error while loading:</strong>
        <p style="margin:10px 0; color:#5b544c;">${ev.message || 'Unknown error'}</p>
        <p style="margin:0; color:#5b544c; font-size:13px;">Open your browser's console (F12 → Console tab) for the full details, or check the FIREBASE_CONFIG values against the setup guide.</p>
      </div>
    `;
  }
});
</script>
<script src="js/lessons-data.js"></script>
<script src="js/reference-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/conjugation.js"></script>
<script src="js/answer-check.js"></script>
<script src="js/session.js"></script>
<script src="js/app.js"></script>
</body>
</html>
