<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日々の学習 — Nihongo Daily</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#223A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nihongo Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (email/password login + cross-device sync). Inert until FIREBASE_CONFIG
     below is filled in with your own project's keys — see the setup guide. -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  :root{
    --paper:#F6F1E4;
    --paper-2:#EFE7D3;
    --ink:#262220;
    --ink-soft:#5b544c;
    --indigo:#223A5E;
    --indigo-2:#3C5A82;
    --vermillion:#BF3B30;
    --vermillion-soft:#e2b3ac;
    --gold:#C99A3B;
    --line:#DCD3BE;
    --success:#5C7A5A;
    --success-soft:#e1e9df;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:32px;
    margin:0;
    line-height:1.1;
    letter-spacing:.02em;
  }
  h1 small{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-top:5px;
  }
  .streak-badge{
    font-family:'JetBrains Mono',monospace;
    text-align:right;
    font-size:12px;
    color:var(--ink-soft);
  }
  .streak-badge b{
    display:block;
    font-family:'Shippori Mincho', serif;
    font-size:26px;
    color:var(--vermillion);
    line-height:1;
  }

  /* ---------- Account / sync bar ---------- */
  .authbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 12px;
    margin-bottom:18px;
    background:var(--paper-2);
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .authbar b{color:var(--indigo); font-weight:600;}
  .authbar button.linklike{
    background:none; border:none; cursor:pointer;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.05em;
    color:var(--vermillion); text-decoration:underline;
    padding:0;
  }
  .authcard{margin-bottom:20px;}
  .authtabs{display:flex; gap:16px; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .authtabs button{
    background:none; border:none; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    padding:8px 2px; color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  .authtabs button.active{color:var(--ink); border-bottom-color:var(--vermillion); font-weight:600;}
  .authfield{margin-bottom:12px;}
  .authfield label{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.05em;}
  .authfield input{
    width:100%; font-family:'Zen Kaku Gothic New',sans-serif; font-size:15px;
    border:1.5px solid var(--ink); background:var(--paper); padding:10px 12px;
  }
  .autherror{color:var(--vermillion); font-size:13px; margin:10px 0 0;}
  .authnote{color:var(--ink-soft); font-size:12px; margin-top:12px;}

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    gap:2px;
    margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s;
  }
  nav.tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--vermillion);
    font-weight:600;
  }
  nav.tabs button:hover{color:var(--ink);}

  /* ---------- Cards ---------- */
  .card{
    background:var(--paper);
    border:1.5px solid var(--ink);
    padding:24px;
    margin-bottom:20px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .card-inner{position:relative;}

  .section-title{
    font-family:'Shippori Mincho', serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 6px;
  }
  .muted{color:var(--ink-soft); font-size:14px;}

  /* ---------- Stamp card (signature element) ---------- */
  .stampcard{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:18px 0 6px;
  }
  .stamp{
    width:40px;height:40px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-size:11px;
    font-weight:800;
    flex-shrink:0;
  }
  .stamp.filled{
    border:2.5px solid var(--vermillion);
    color:var(--vermillion);
    transform:rotate(-6deg);
    box-shadow:inset 0 0 0 2px rgba(191,59,48,.08);
    animation:stampland .35s ease-out;
  }
  .stamp.empty{
    border:1.5px dashed var(--line);
    color:var(--line);
  }
  @keyframes stampland{
    0%{transform:rotate(-6deg) scale(1.9); opacity:0;}
    60%{transform:rotate(-6deg) scale(0.92); opacity:1;}
    100%{transform:rotate(-6deg) scale(1);}
  }

  /* ---------- Buttons ---------- */
  button.primary{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:.06em;
    background:var(--indigo);
    color:var(--paper);
    border:none;
    padding:13px 22px;
    cursor:pointer;
    text-transform:uppercase;
    transition:background .15s;
  }
  button.primary:hover{background:var(--indigo-2);}
  button.ghost{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:none;
    border:1.5px solid var(--ink);
    color:var(--ink);
    padding:10px 16px;
    cursor:pointer;
    letter-spacing:.05em;
  }
  button.ghost:hover{background:var(--ink); color:var(--paper);}
  button:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Progress dots ---------- */
  .dots{display:flex; gap:6px; margin:14px 0;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dot.done{background:var(--indigo);}
  .dot.wrong{background:var(--vermillion);}

  /* ---------- Question ---------- */
  .qmeta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .qprompt{
    font-size:22px;
    font-weight:700;
    margin:0 0 20px;
    line-height:1.5;
  }
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice{
    text-align:left;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px;
    background:var(--paper);
    border:1.5px solid var(--ink);
    padding:13px 16px;
    cursor:pointer;
    transition:.12s;
  }
  .choice:hover{background:var(--paper-2);}
  .choice.correct{
    background:var(--success-soft);
    border-color:var(--success);
    color:var(--success);
    font-weight:700;
  }
  .choice.incorrect{
    background:#f3dcd9;
    border-color:var(--vermillion);
    color:var(--vermillion);
    font-weight:700;
  }
  .choice[disabled]{cursor:default;}
  .feedback-note{
    margin-top:16px;
    padding:12px 14px;
    background:var(--paper-2);
    border-left:3px solid var(--gold);
    font-size:14px;
    color:var(--ink-soft);
  }
  .nextbar{margin-top:20px; display:flex; justify-content:flex-end;}

  /* ---------- Lessons list ---------- */
  .lesson-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .lesson-row:last-child{border-bottom:none;}
  .lesson-num{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    font-weight:800;
    width:34px;
    color:var(--ink-soft);
  }
  .lesson-row.unlocked .lesson-num{color:var(--indigo);}
  .lesson-row.done .lesson-num{color:var(--vermillion);}
  .lesson-title{flex:1;}
  .lesson-title b{display:block; font-size:15px;}
  .lesson-title span{font-size:12px; color:var(--ink-soft);}
  .lesson-status{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:4px 8px;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }
  .lesson-status.avail{border-color:var(--indigo); color:var(--indigo);}
  .lesson-status.done{border-color:var(--vermillion); color:var(--vermillion);}

  /* ---------- Capstone ---------- */
  .en-sentence{
    font-family:'Shippori Mincho', serif;
    font-style:italic;
    font-size:19px;
    margin:0 0 14px;
    line-height:1.5;
  }
  textarea{
    width:100%;
    min-height:80px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:18px;
    border:1.5px solid var(--ink);
    background:var(--paper);
    padding:12px;
    resize:vertical;
  }
  .model-answer{
    margin-top:16px;
    padding:16px;
    background:var(--paper-2);
    border-left:3px solid var(--indigo);
  }
  .model-answer .jp{font-size:20px; font-weight:700; margin-bottom:6px;}
  .model-answer .note{font-size:13px; color:var(--ink-soft);}
  .selfgrade{display:flex; gap:10px; margin-top:16px;}

  /* ---------- Stats ---------- */
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;}
  .statbox{border:1px solid var(--line); padding:14px;}
  .statbox .num{font-family:'Shippori Mincho',serif; font-size:28px; font-weight:800; color:var(--indigo);}
  .statbox .lbl{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.06em;}
  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
  .barrow .lname{width:80px; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:11px;}
  .barwrap{flex:1; height:8px; background:var(--paper-2); border:1px solid var(--line);}
  .barfill{height:100%; background:var(--indigo);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state .glyph{font-family:'Shippori Mincho',serif; font-size:40px; color:var(--vermillion); margin-bottom:10px;}

  /* ---------- Grammar tab ---------- */
  .gstruct{border-bottom:1px solid var(--line); padding:14px 0;}
  .gstruct:last-child{border-bottom:none;}
  .gstruct-title{font-family:'Shippori Mincho',serif; font-weight:700; font-size:16px;}
  .gexample{background:var(--paper-2); border-left:3px solid var(--indigo); padding:10px 12px; margin-top:8px;}
  .gexample-jp{font-size:16px; font-weight:600; margin-bottom:3px;}
  .gexample-en{font-size:13px; color:var(--ink-soft); font-style:italic;}
  .gexample-note{font-size:12px; color:var(--ink-soft); margin-top:6px; border-top:1px dashed var(--line); padding-top:6px;}
  .particle-list{margin-top:6px;}
  .particle-row{border-bottom:1px solid var(--line);}
  .particle-row:last-child{border-bottom:none;}
  .particle-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    padding:14px 4px;
    cursor:pointer;
    text-align:left;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .particle-char{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:22px;
    color:var(--indigo);
    width:38px;
    flex-shrink:0;
  }
  .particle-role{flex:1; font-size:14px;}
  .particle-level{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--vermillion);
    border:1px solid var(--vermillion-soft);
    padding:2px 6px;
    flex-shrink:0;
  }
  .particle-caret{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    color:var(--ink-soft);
    width:16px;
    text-align:center;
    flex-shrink:0;
  }
  .particle-body{padding:0 4px 16px;}
  .gpattern{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:var(--paper-2);
    border:1px dashed var(--line);
    padding:8px 10px;
    margin-bottom:10px;
    color:var(--indigo-2);
  }

  /* ---------- N5 Textbook tab ---------- */
  .tb-lesson{border-bottom:1px solid var(--line);}
  .tb-lesson:last-child{border-bottom:none;}
  .tb-lesson-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    background:none;
    border:none;
    padding:14px 4px;
    cursor:pointer;
    text-align:left;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .tb-lesson-num{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:22px;
    color:var(--indigo);
    width:34px;
    flex-shrink:0;
  }
  .tb-lesson-title-wrap{flex:1;}
  .tb-lesson-title-wrap b{display:block; font-size:15px;}
  .tb-lesson-title-wrap span{font-size:12px; color:var(--ink-soft);}
  .tb-lesson-body{padding:4px 4px 20px;}
  .tb-section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--vermillion);
    border-bottom:1px solid var(--vermillion-soft);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .tb-vocab-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 18px;
  }
  .tb-vocab-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px dotted var(--line);
    font-size:14px;
  }
  .tb-vocab-jp{font-weight:600; flex-shrink:0;}
  .tb-vocab-en{color:var(--ink-soft); text-align:right; font-size:13px;}
  .tb-pattern{margin-bottom:16px;}
  .tb-pattern-title{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:16px;
  }

  footer{text-align:center; margin-top:40px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.05em;}

  @media (max-width:480px){
    h1{font-size:26px;}
    .qprompt{font-size:19px;}
    .statgrid{grid-template-columns:1fr;}
    .tb-vocab-list{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Minna no Nihongo I &middot; Daily Practice</div>
      <h1>日々の学習<span style="font-size:14px; font-weight:500; color:var(--ink-soft); margin-left:6px;">（ひびのがくしゅう）</span><small>NIHONGO DAILY</small></h1>
    </div>
    <div class="streak-badge">STREAK<b id="streakNum">0</b>days</div>
  </header>

  <div id="authBar"></div>

  <nav class="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="lessons">Lessons</button>
    <button data-tab="grammar">Grammar</button>
    <button data-tab="textbook">N5 Textbook</button>
    <button data-tab="stats">Stats</button>
  </nav>

  <main id="main"></main>

  <footer id="storageFooter">ONE PAGE, YOUR STORY 訳 &middot; CHECKING STORAGE&hellip;</footer>
</div>

<script>
/* ============================================================
   SAFETY NET — if anything anywhere throws an uncaught error before
   the app finishes loading, show a visible message instead of a
   silent blank page.
   ============================================================ */
window.addEventListener('error', function(ev){
  const mainEl = document.getElementById('main');
  if(mainEl && !mainEl.dataset.loaded){
    mainEl.innerHTML = `
      <div style="border:1.5px solid #BF3B30; padding:20px; font-family:sans-serif;">
        <strong>The app hit an error while loading:</strong>
        <p style="margin:10px 0; color:#5b544c;">${ev.message || 'Unknown error'}</p>
        <p style="margin:0; color:#5b544c; font-size:13px;">Open your browser's console (F12 → Console tab) for the full details, or check the FIREBASE_CONFIG values against the setup guide.</p>
      </div>
    `;
  }
});

/* ============================================================
   DATA — 25 lessons, each with quiz questions + capstone lines
   ============================================================ */
const LESSONS = [
{n:1,title:"これ・それ・あれ / です",topic:"Identifying things, basic です sentences",
 q:[
  {type:"vocab",prompt:"How do you say \"this (thing, near me)\" in Japanese?",choices:["これ","それ","あれ","どれ"],a:0,note:"これ = this (near speaker). それ = that (near listener). あれ = that over there (far from both)."},
  {type:"vocab",prompt:"「学生（がくせい）」means:",choices:["Teacher","Student","Company employee","Doctor"],a:1,note:"学生（がくせい）= student."},
  {type:"grammar",prompt:"これ ___ 辞書（じしょ）です。(This is a dictionary.)",choices:["は","を","に","で"],a:0,note:"は marks the topic. 'これは辞書（じしょ）です' = As for this, it is a dictionary."},
  {type:"structure",prompt:"Choose the correct question form of 'Is that a book?'",choices:["それは 本（ほん）です か。","それは 本（ほん）ですか。","それ 本（ほん）は ですか。","それ は 本（ほん） か です。"],a:1,note:"Add か directly after です, no extra space needed: それは本（ほん）ですか。"}
 ],
 cap:[
  {en:"This is a dictionary.",jp:"これは 辞書（じしょ）です。",note:"これ + は + noun + です for simple identification."},
  {en:"Is that your umbrella?",jp:"それは あなたの 傘（かさ）ですか。",note:"あなたの = your; の links possessor and noun."}
 ]},
{n:2,title:"この／その／あの + N",topic:"Demonstrative adjectives, prices",
 q:[
  {type:"vocab",prompt:"「傘（かさ）」means:",choices:["Umbrella","Book","Watch","Bag"],a:0,note:"傘（かさ）= umbrella."},
  {type:"vocab",prompt:"How do you ask \"How much is it?\"",choices:["これは 何（なに）ですか。","いくらですか。","どこですか。","誰（だれ）のですか。"],a:1,note:"いくら = how much (price)."},
  {type:"grammar",prompt:"___ 本（ほん）は 私（わたし）のです。(That book [near you] is mine.)",choices:["この","その","あの","どの"],a:1,note:"その + noun = that (near listener). Contrast with それ, which stands alone."},
  {type:"structure",prompt:"Which is correctly formed: \"Whose bag is this?\"",choices:["これは 誰（だれ）の かばんですか。","これ 誰（だれ）は かばんですか。","誰（だれ）の これは かばんですか。","これは かばん 誰（だれ）のですか。"],a:0,note:"誰（だれ）の (whose) + noun comes right before です."}
 ],
 cap:[
  {en:"This pen is 500 yen.",jp:"この ペンは 500円（えん）です。",note:"この + noun for 'this ___', then price + です."},
  {en:"Whose dictionary is that (over there)?",jp:"あれは 誰（だれ）の 辞書（じしょ）ですか。",note:"あれ stands alone (no noun follows) since it means 'that thing over there'."}
 ]},
{n:3,title:"ここ・そこ・あそこ / どこ",topic:"Places, N1のN2, asking origin",
 q:[
  {type:"vocab",prompt:"「デパート」means:",choices:["Station","Department store","Hospital","School"],a:1,note:"デパート = department store (loanword)."},
  {type:"vocab",prompt:"How do you say \"where\"?",choices:["ここ","そこ","あそこ","どこ"],a:3,note:"どこ = where (question word)."},
  {type:"grammar",prompt:"お手洗（てあら）いは ___ ですか。(Where is the restroom?)",choices:["どこ","なに","だれ","いつ"],a:0,note:"どこ asks about location."},

    example:{jp:"この 町（まち）は 冬（ふゆ）が 寒（さむ）いです。",en:"As for this town, [its] winters are cold.",note:"町 is the topic (は); 冬 is the subject of 寒い (が)."}

// Two possible save destinations depending on where this file is running:
//  - "cloud": Claude.ai's built-in artifact storage (window.storage) — works when
//             this file is opened/rendered inside a Claude.ai conversation.
//  - "local": the browser's own localStorage — works when this .html file is
//             downloaded and opened directly (double-clicked, file://, or hosted).
// We detect which is available at load time and use that one consistently.
let STORAGE_MODE = 'none';

function detectStorageMode(){
  if(FIREBASE_READY && fbUser){
    return 'firebase';
  }
  if(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function'){
    return 'cloud';
  }
  try{
    const testKey = '__nihongo_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return 'local';
  }catch(e){
    return 'none';
  }
}

function defaultProgress(){
  return {
    currentLesson: 1,
    seen: {},              // qKey -> {count, correct}
    dailyLog: {},           // date -> {qids:[], completed:bool}
    capstoneStatus: {},     // lessonNum -> 'locked'|'available'|'done'
    capstoneResults: {},    // lessonNum -> {sentenceIdx: 'good'|'retry'}
    streak: 0,
    lastCompletedDate: null,
    totalStamps: 0,
    stampDates: []
  };
}

async function loadProgress(){
  STORAGE_MODE = detectStorageMode();
  let loaded = null;
  try{
    if(STORAGE_MODE === 'firebase'){
      const snap = await fbDb.collection('progress').doc(fbUser.uid).get();
      loaded = (snap.exists && snap.data().payload) ? JSON.parse(snap.data().payload) : null;
    } else if(STORAGE_MODE === 'cloud'){
      const res = await window.storage.get(STORE_KEY, false);
      loaded = (res && res.value) ? JSON.parse(res.value) : null;
    } else if(STORAGE_MODE === 'local'){
      const raw = window.localStorage.getItem(STORE_KEY);
      loaded = raw ? JSON.parse(raw) : null;
    }
  }catch(e){
    // Read failed — fall back to a local safety-net copy if one exists,
    // so a backend hiccup doesn't look like lost progress.
    try{
      const raw = window.localStorage.getItem(STORE_KEY + '-safetynet');
      loaded = raw ? JSON.parse(raw) : null;
    }catch(e2){ /* no safety net available either */ }
  }
  PROGRESS = loaded || defaultProgress();
  if(!PROGRESS.capstoneStatus[1]) PROGRESS.capstoneStatus[1] = 'locked';
}

let SAVE_STATUS = 'ok'; // 'ok' | 'retrying' | 'fallback'

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function saveProgress(){
  const payload = JSON.stringify(PROGRESS);

  // Always keep a silent local safety-net copy, regardless of primary storage
  // mode, so a transient server error never risks losing a session's progress.
  try{ window.localStorage.setItem(STORE_KEY + '-safetynet', payload); }catch(e){ /* ignore */ }

  if(STORAGE_MODE === 'firebase'){
    for(let attempt=1; attempt<=2; attempt++){
      try{
        await fbDb.collection('progress').doc(fbUser.uid).set({payload, updatedAt: Date.now()});
        SAVE_STATUS = 'ok';
        updateSaveStatusUI();
        return;
      }catch(e){
        if(attempt===1){
          await wait(600);
        } else {
          console.warn('Sync temporarily unavailable, kept locally instead', e);
          SAVE_STATUS = 'fallback';
          updateSaveStatusUI();
        }
      }
    }
    return;
  }

  if(STORAGE_MODE === 'local'){
    try{
      window.localStorage.setItem(STORE_KEY, payload);
      SAVE_STATUS = 'ok';
    }catch(e){
      console.warn('Local save failed', e);
      SAVE_STATUS = 'fallback';
    }
    updateSaveStatusUI();
    return;
  }

  if(STORAGE_MODE === 'cloud'){
    for(let attempt=1; attempt<=2; attempt++){
      try{
        await window.storage.set(STORE_KEY, payload, false);
        SAVE_STATUS = 'ok';
        updateSaveStatusUI();
        return;
      }catch(e){
        if(attempt===1){
          await wait(600);
        } else {
          // Both attempts failed — likely a transient backend issue. Progress is
          // still safe in the local safety-net copy above; just let the person
          // know saving is temporarily delayed rather than showing a raw error.
          console.warn('Cloud save temporarily unavailable, kept locally instead', e);
          SAVE_STATUS = 'fallback';
          updateSaveStatusUI();
        }
      }
    }
    return;
  }
  // STORAGE_MODE 'none' — nothing persistent available; already safety-netted above if possible.
}

function updateSaveStatusUI(){
  const footer = document.getElementById('storageFooter');
  if(!footer) return;
  if(SAVE_STATUS === 'fallback'){
    footer.innerHTML = `ONE PAGE, YOUR STORY 訳 &middot; SYNC DELAYED &mdash; KEPT SAFE LOCALLY, WILL RETRY`;
  } else {
    const msg = STORAGE_MODE==='firebase' ? `SYNCED TO YOUR ACCOUNT (${fbUser.email})`
      : STORAGE_MODE==='cloud' ? 'PROGRESS SAVES TO YOUR CLAUDE.AI ACCOUNT'
      : STORAGE_MODE==='local' ? 'PROGRESS SAVES TO THIS BROWSER ONLY'
      : 'STORAGE UNAVAILABLE &mdash; PROGRESS WON\u2019T PERSIST';
    footer.innerHTML = `ONE PAGE, YOUR STORY 訳 &middot; ${msg}`;
  }
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(PROGRESS, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nihongo-daily-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(typeof parsed !== 'object' || parsed===null) throw new Error('Invalid file');
      PROGRESS = Object.assign(defaultProgress(), parsed);
      await saveProgress();
      render();
      alert('Progress restored from backup.');
    }catch(err){
      alert("Couldn't read that file — make sure it's a Nihongo Daily backup .json.");
    }
  };
  reader.readAsText(file);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function dateSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function shuffle(arr, rand){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function allQuestionsUpTo(lessonNum){
  const out = [];
  LESSONS.filter(l=>l.n<=lessonNum).forEach(l=>{
    l.q.forEach((q,i)=> out.push({...q, lesson:l.n, qid:l.n+"-"+i}));
  });
  return out;
}
function lessonQuestionIds(lessonNum){
  const l = LESSONS.find(x=>x.n===lessonNum);
  return l.q.map((q,i)=> l.n+"-"+i);
}
function lessonFullySeen(lessonNum){
  return lessonQuestionIds(lessonNum).every(qid => PROGRESS.seen[qid] && PROGRESS.seen[qid].count>0);
}
function getTodaysSet(){
  const date = todayStr();
  if(PROGRESS.dailyLog[date]) return PROGRESS.dailyLog[date];
  const pool = allQuestionsUpTo(PROGRESS.currentLesson);
  const rand = mulberry32(dateSeed(date));
  const shuffled = shuffle(pool, rand);
  const count = Math.min(12, shuffled.length);
  const picked = shuffled.slice(0,count).map(q=>q.qid);
  PROGRESS.dailyLog[date] = { qids: picked, answers:{}, completed:false };
  saveProgress();
  return PROGRESS.dailyLog[date];
}
function qByQid(qid){
  const [lessonNum, idx] = qid.split("-").map(Number);
  const l = LESSONS.find(x=>x.n===lessonNum);
  return {...l.q[idx], lesson:lessonNum, qid};
}

// Builds an on-demand practice round for the current lesson, with no daily limit.
// Prioritizes questions from the current lesson not yet seen (so capstones unlock
// fast); once everything in the lesson has been seen at least once, it recycles
// the same lesson's questions for extra reinforcement rounds.
function buildPracticeSet(){
  const cur = PROGRESS.currentLesson;
  const ids = lessonQuestionIds(cur);
  const unseen = ids.filter(qid => !PROGRESS.seen[qid] || PROGRESS.seen[qid].count===0);
  const pool = unseen.length>0 ? unseen : ids;
  return pool.slice().sort(()=>Math.random()-0.5);
}
function updateStreakOnComplete(){
  const date = todayStr();
  if(PROGRESS.lastCompletedDate === date) return;
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestStr = yest.getFullYear()+"-"+String(yest.getMonth()+1).padStart(2,'0')+"-"+String(yest.getDate()).padStart(2,'0');
  if(PROGRESS.lastCompletedDate === yestStr){
    PROGRESS.streak += 1;
  } else {
    PROGRESS.streak = 1;
  }
  PROGRESS.lastCompletedDate = date;
  if(!PROGRESS.stampDates.includes(date)){
    PROGRESS.stampDates.push(date);
    PROGRESS.totalStamps += 1;
  }
}
function checkLessonUnlocks(){
  const cur = PROGRESS.currentLesson;
  if(lessonFullySeen(cur) && (!PROGRESS.capstoneStatus[cur] || PROGRESS.capstoneStatus[cur]==='locked')){
    PROGRESS.capstoneStatus[cur] = 'available';
  }
}
function isCapstoneDone(lessonNum){
  return PROGRESS.capstoneStatus[lessonNum] === 'done';
}
function completeCapstone(lessonNum){
  PROGRESS.capstoneStatus[lessonNum] = 'done';
  if(lessonNum === PROGRESS.currentLesson && lessonNum < 25){
    PROGRESS.currentLesson = lessonNum + 1;
    if(!PROGRESS.capstoneStatus[lessonNum+1]) PROGRESS.capstoneStatus[lessonNum+1] = 'locked';
  }
}

let activeTab = 'today';
let quizState = null; // {qids, idx, mode:'daily'|'practice', answers}
let capstoneState = null; // {lessonNum, idx, showAnswer}

const main = document.getElementById('main');

  capstoneState = null;
  render();
}
document.querySelectorAll('nav.tabs button').forEach(b=>{

});

function render(){
  document.getElementById('streakNum').textContent = PROGRESS.streak;

  if(activeTab==='today') renderToday();
  else if(activeTab==='lessons') renderLessons();
  else if(activeTab==='grammar') renderGrammar();
  else if(activeTab==='textbook') renderTextbook();
  else if(activeTab==='stats') renderStats();
}

function renderToday(){
  checkLessonUnlocks();
  const date = todayStr();
  const set = getTodaysSet();
  const curLesson = LESSONS.find(l=>l.n===PROGRESS.currentLesson);

  if(quizState){
    renderQuizQuestion();
    return;
  }

  let stampsHtml = '';
  const last14 = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
    last14.push(ds);
  }
  last14.forEach(ds=>{
    const filled = PROGRESS.stampDates.includes(ds);
    const day = Number(ds.split('-')[2]);
    stampsHtml += `<div class="stamp ${filled?'filled':'empty'}">${filled?'済':day}</div>`;
  });

  const answeredCount = Object.keys(set.answers||{}).length;
  let dotsHtml = '';
  set.qids.forEach(qid=>{
    const ans = set.answers ? set.answers[qid] : null;
    let cls = 'dot';
    if(ans!==undefined && ans!==null){ cls += ans.correct ? ' done' : ' wrong'; }
    dotsHtml += `<div class="${cls}"></div>`;
  });

  const capstoneAvailable = PROGRESS.capstoneStatus[PROGRESS.currentLesson] === 'available';
  const allDone = set.completed;
  const lessonRemaining = lessonQuestionIds(PROGRESS.currentLesson).filter(qid => !PROGRESS.seen[qid] || PROGRESS.seen[qid].count===0).length;

  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="section-title">Today &mdash; ${date}</div>
      <p class="muted">Lesson ${PROGRESS.currentLesson} in rotation &middot; ${curLesson.title}</p>
      <div class="dots">${dotsHtml}</div>
      ${ allDone
        ? `<p class="muted" style="margin-top:14px;">You've completed today's ${set.qids.length} questions${capstoneAvailable ? ' &mdash; nice work. Take on the lesson capstone below whenever you\'re ready.' : '.'}</p>`
        : `<button class="primary" id="startQuizBtn" style="margin-top:8px;">${answeredCount>0 ? 'Continue Quiz' : "Start Today's Quiz"}</button>`
      }
      <div class="stampcard">${stampsHtml}</div>
      <p class="muted" style="font-size:11px;">Stamp trail &middot; last 14 days</p>
    </div></div>

    <div class="card"><div class="card-inner">
      <div class="section-title" style="font-size:17px;">Keep Going</div>
      <p class="muted">Not limited to once a day &mdash; drill Lesson ${PROGRESS.currentLesson} whenever you like to unlock its capstone and move on to the next lesson.</p>
      <button class="ghost" id="practiceBtn" style="margin-top:10px;">${lessonRemaining>0 ? `Practice Lesson ${PROGRESS.currentLesson} (${lessonRemaining} new)` : `Review Lesson ${PROGRESS.currentLesson} Again`}</button>
    </div></div>

    ${capstoneAvailable ? `
    <div class="card"><div class="card-inner">
      <div class="section-title">Lesson ${PROGRESS.currentLesson} Capstone Unlocked</div>
      <p class="muted">${curLesson.title} &middot; Translate short English sentences into Japanese using this lesson's grammar and vocabulary.</p>
      <button class="primary" id="startCapstoneBtn" style="margin-top:10px;">Begin Capstone</button>
    </div></div>` : '' }

    ${ (PROGRESS.currentLesson>1 || Object.values(PROGRESS.capstoneStatus).some(s=>s==='done')) ? `
    <div class="card"><div class="card-inner">
      <div class="section-title" style="font-size:16px;">Progress</div>
      <p class="muted">Lessons completed: ${Object.values(PROGRESS.capstoneStatus).filter(s=>s==='done').length} / 25 &middot; Currently on Lesson ${PROGRESS.currentLesson}</p>
    </div></div>` : ''}
  `;

  const startBtn = document.getElementById('startQuizBtn');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    quizState = { qids: set.qids, idx: answeredCount, mode:'daily', answers:{} };
    renderQuizQuestion();
  });
  const practiceBtn = document.getElementById('practiceBtn');
  if(practiceBtn) practiceBtn.addEventListener('click', ()=>{
    quizState = { qids: buildPracticeSet(), idx: 0, mode:'practice', answers:{} };
    renderQuizQuestion();
  });
  const capBtn = document.getElementById('startCapstoneBtn');
  if(capBtn) capBtn.addEventListener('click', ()=>{
    capstoneState = { lessonNum: PROGRESS.currentLesson, idx:0, showAnswer:false };
    renderCapstone();
  });
}

function renderQuizQuestion(){
  const isDaily = quizState.mode === 'daily';
  const dailySet = isDaily ? PROGRESS.dailyLog[todayStr()] : null;

  if(quizState.idx >= quizState.qids.length){
    if(isDaily){
      dailySet.completed = true;
      updateStreakOnComplete();
    }
    checkLessonUnlocks();
    saveProgress();
    quizState = null;
    renderToday();
    return;
  }
  const qid = quizState.qids[quizState.idx];
  const q = qByQid(qid);
  const alreadyAnswered = quizState.answers[qid];

  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="qmeta">Lesson ${q.lesson} &middot; ${q.type} &middot; ${isDaily ? 'Today\u2019s Quiz' : 'Practice Round'} &middot; Question ${quizState.idx+1} of ${quizState.qids.length}</div>
      <p class="qprompt">${q.prompt}</p>
      <div class="choices" id="choicesWrap"></div>
      <div id="feedbackArea"></div>
      <div class="nextbar" id="nextBar" style="display:none;">
        <button class="primary" id="nextBtn">Next &rarr;</button>
      </div>
    </div></div>
  `;
  const wrap = document.getElementById('choicesWrap');
  q.choices.forEach((choiceText, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choiceText;
    btn.addEventListener('click', ()=> selectAnswer(qid, q, i));
    wrap.appendChild(btn);
  });

  if(alreadyAnswered){
    lockChoices(q, alreadyAnswered.picked);
  }
}

function selectAnswer(qid, q, pickedIdx){
  const isDaily = quizState.mode === 'daily';
  const correct = pickedIdx === q.a;
  quizState.answers[qid] = { picked: pickedIdx, correct };

  if(isDaily){
    const dailySet = PROGRESS.dailyLog[todayStr()];
    if(!dailySet.answers) dailySet.answers = {};
    dailySet.answers[qid] = { picked: pickedIdx, correct };
  }

  if(!PROGRESS.seen[qid]) PROGRESS.seen[qid] = {count:0, correct:0};
  PROGRESS.seen[qid].count += 1;
  if(correct) PROGRESS.seen[qid].correct += 1;

  saveProgress();
  lockChoices(q, pickedIdx);
}

function lockChoices(q, pickedIdx){
  const wrap = document.getElementById('choicesWrap');
  Array.from(wrap.children).forEach((btn, i)=>{
    btn.disabled = true;
    if(i===q.a) btn.classList.add('correct');
    else if(i===pickedIdx) btn.classList.add('incorrect');
  });
  document.getElementById('feedbackArea').innerHTML = `<div class="feedback-note">${q.note}</div>`;
  document.getElementById('nextBar').style.display = 'flex';
  document.getElementById('nextBtn').onclick = ()=>{
    quizState.idx += 1;
    renderQuizQuestion();
  };
}

function renderCapstone(){
  const lesson = LESSONS.find(l=>l.n===capstoneState.lessonNum);
  const sentence = lesson.cap[capstoneState.idx];
  const isLast = capstoneState.idx === lesson.cap.length - 1;

  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="qmeta">Lesson ${lesson.n} Capstone &middot; ${capstoneState.idx+1} of ${lesson.cap.length}</div>
      <p class="en-sentence">&ldquo;${sentence.en}&rdquo;</p>
      <textarea id="capInput" placeholder="Type your Japanese translation here..."></textarea>
      <div style="margin-top:14px;" id="capActionArea">
        <button class="primary" id="revealBtn">Show Model Answer</button>
      </div>
      <div id="capAnswerArea"></div>
    </div></div>
  `;

  document.getElementById('revealBtn').addEventListener('click', ()=>{
    document.getElementById('capAnswerArea').innerHTML = `
      <div class="model-answer">
        <div class="jp">${sentence.jp}</div>
        <div class="note">${sentence.note}</div>
      </div>
      <div class="selfgrade">
        <button class="ghost" id="gotItBtn">✓ Got it right</button>
        <button class="ghost" id="retryBtn">Needs more work</button>
      </div>
    `;
    document.getElementById('capActionArea').innerHTML = '';
    document.getElementById('gotItBtn').addEventListener('click', ()=> gradeCapstone(true));
    document.getElementById('retryBtn').addEventListener('click', ()=> gradeCapstone(false));
  });

  function gradeCapstone(good){
    if(!PROGRESS.capstoneResults[lesson.n]) PROGRESS.capstoneResults[lesson.n] = {};
    PROGRESS.capstoneResults[lesson.n][capstoneState.idx] = good ? 'good' : 'retry';
    saveProgress();
    if(isLast){
      completeCapstone(lesson.n);
      saveProgress();
      capstoneState = null;
      setTab('today');
    } else {
      capstoneState.idx += 1;
      renderCapstone();
    }
  }
}

function renderLessons(){
  let rows = '';
  LESSONS.forEach(l=>{
    const status = PROGRESS.capstoneStatus[l.n] || (l.n < PROGRESS.currentLesson ? 'done' : (l.n===PROGRESS.currentLesson ? 'locked' : 'locked'));
    let label = 'Locked', cls = '';
    if(status==='done'){ label='Complete'; cls='done'; }
    else if(status==='available'){ label='Capstone Ready'; cls='avail'; }
    else if(l.n===PROGRESS.currentLesson){ label='In Progress'; cls='avail'; }
    const rowCls = status==='done' ? 'done' : (l.n<=PROGRESS.currentLesson ? 'unlocked' : '');
    rows += `
      <div class="lesson-row ${rowCls}" data-lesson="${l.n}">
        <div class="lesson-num">${String(l.n).padStart(2,'0')}</div>
        <div class="lesson-title"><b>${l.title}</b><span>${l.topic}</span></div>
        <div class="lesson-status ${cls}">${label}</div>
      </div>
    `;
  });
  main.innerHTML = `<div class="card"><div class="card-inner">
    <div class="section-title">25 Lessons</div>
    <p class="muted">Tap an unlocked lesson to review its capstone.</p>
    ${rows}
  </div></div>`;

  document.querySelectorAll('.lesson-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const n = Number(row.dataset.lesson);
      const status = PROGRESS.capstoneStatus[n];
      if(status==='available'){
        capstoneState = { lessonNum:n, idx:0, showAnswer:false };
        activeTab = 'today';
        document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab==='today'));
        renderCapstone();
      } else if(status==='done'){
        capstoneState = { lessonNum:n, idx:0, showAnswer:false };
        activeTab = 'today';
        document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab==='today'));
        renderCapstone();
      }
    });
  });
}

function renderStats(){
  const seenIds = Object.keys(PROGRESS.seen);
  let totalAttempts=0, totalCorrect=0;
  seenIds.forEach(id=>{
    totalAttempts += PROGRESS.seen[id].count;
    totalCorrect += PROGRESS.seen[id].correct;
  });
  const acc = totalAttempts>0 ? Math.round(100*totalCorrect/totalAttempts) : 0;
  const lessonsDone = Object.values(PROGRESS.capstoneStatus).filter(s=>s==='done').length;

  let barsHtml = '';
  LESSONS.filter(l=>l.n<=PROGRESS.currentLesson).forEach(l=>{
    const ids = lessonQuestionIds(l.n);
    let att=0, cor=0;
    ids.forEach(id=>{
      if(PROGRESS.seen[id]){ att+=PROGRESS.seen[id].count; cor+=PROGRESS.seen[id].correct; }
    });
    const pct = att>0 ? Math.round(100*cor/att) : 0;
    barsHtml += `
      <div class="barrow">
        <div class="lname">L${l.n}</div>
        <div class="barwrap"><div class="barfill" style="width:${pct}%"></div></div>
        <div style="width:34px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:11px;">${pct}%</div>
      </div>
    `;
  });

  main.innerHTML = `
    <div class="statgrid">
      <div class="statbox"><div class="num">${PROGRESS.streak}</div><div class="lbl">Day Streak</div></div>
      <div class="statbox"><div class="num">${acc}%</div><div class="lbl">Overall Accuracy</div></div>
      <div class="statbox"><div class="num">${lessonsDone}/25</div><div class="lbl">Lessons Complete</div></div>
      <div class="statbox"><div class="num">${PROGRESS.totalStamps}</div><div class="lbl">Total Stamps</div></div>
    </div>
    <div class="card"><div class="card-inner">
      <div class="section-title" style="font-size:17px;">Mastery by Lesson</div>
      <p class="muted">Accuracy across all attempts so far, current lesson and earlier.</p>
      <div style="margin-top:16px;">${barsHtml || '<p class="muted">Answer some questions to see lesson breakdowns here.</p>'}</div>
    </div></div>

    <div class="card"><div class="card-inner">
      <div class="section-title" style="font-size:17px;">Backup &amp; Restore</div>
      <p class="muted">
        ${STORAGE_MODE==='local'
          ? "Progress currently saves to this browser's storage. Clearing your browser data will erase it, so download a backup now and then to be safe."
          : STORAGE_MODE==='cloud'
            ? "Progress saves to your Claude.ai account automatically. A backup file is still handy if you want to move your progress to a locally-opened copy of this file."
            : "This browser doesn't support saved storage right now, so progress will reset when you close the page. Download a backup before closing so you can restore it next time."}
      </p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
        <button class="ghost" id="exportBtn">Download Backup (.json)</button>
        <label class="ghost" for="importFile" style="display:inline-block; cursor:pointer;">Restore From Backup</label>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </div></div>
  `;

  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importFile').addEventListener('change', (e)=>{
    if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  });
}

      <div class="authbar">
        <span>Signed in as <b>${fbUser.email}</b> &middot; syncing across devices</span>
        <button class="linklike" id="signOutBtn">Sign out</button>
      </div>
    `;
    document.getElementById('signOutBtn').addEventListener('click', ()=> fbAuth.signOut());
    return;
  }

  if(!showAuthForm){
    bar.innerHTML = `
      <div class="authbar">
        <span>Not signed in &mdash; progress is only saved on this device</span>
        <button class="linklike" id="openAuthBtn">Sign in to sync</button>
      </div>
    `;
    document.getElementById('openAuthBtn').addEventListener('click', ()=>{ showAuthForm = true; renderAuthBar(); });
    return;
  }

  bar.innerHTML = `
    <div class="card authcard"><div class="card-inner">
      <div class="authtabs">
        <button data-mode="login" class="${authFormMode==='login'?'active':''}">Log In</button>
        <button data-mode="signup" class="${authFormMode==='signup'?'active':''}">Create Account</button>
      </div>
      <div class="authfield">
        <label>Email</label>
        <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="authfield">
        <label>Password</label>
        <input type="password" id="authPassword" autocomplete="${authFormMode==='signup'?'new-password':'current-password'}" placeholder="At least 6 characters">
      </div>
      ${authError ? `<p class="autherror">${authError}</p>` : ''}
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button class="primary" id="authSubmitBtn">${authBusy ? 'Please wait…' : (authFormMode==='login' ? 'Log In' : 'Create Account')}</button>
        <button class="ghost" id="authCancelBtn">Cancel</button>
      </div>
      <p class="authnote">Your account only unlocks sync for this quiz app &mdash; use any email and password you'll remember. There's no password recovery yet, so keep it somewhere safe.</p>
    </div></div>
  `;
  document.querySelectorAll('.authtabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ authFormMode = b.dataset.mode; authError=''; renderAuthBar(); });
  });
  document.getElementById('authCancelBtn').addEventListener('click', ()=>{ showAuthForm=false; authError=''; renderAuthBar(); });
  document.getElementById('authSubmitBtn').addEventListener('click', submitAuthForm);
}

async function submitAuthForm(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError = '';
  if(!email || !password){
    authError = 'Please fill in both fields.';
    renderAuthBar();
    return;
  }
  authBusy = true;
  renderAuthBar();
  try{
    if(authFormMode === 'signup'){
      await fbAuth.createUserWithEmailAndPassword(email, password);
    } else {
      await fbAuth.signInWithEmailAndPassword(email, password);
    }
    showAuthForm = false;
    authError = '';
    // onAuthStateChanged below picks up the new session, reloads progress, and re-renders.
  }catch(e){
    authError = friendlyAuthError(e);
  }
  authBusy = false;
  renderAuthBar();
}

function friendlyAuthError(e){
  const code = e && e.code ? e.code : '';
  if(code.includes('email-already-in-use')) return 'That email already has an account — try Log In instead.';
  if(code.includes('wrong-password') || code.includes('user-not-found') || code.includes('invalid-credential')) return 'Email or password not recognized.';
  if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(code.includes('invalid-email')) return 'That email address doesn\u2019t look right.';
  return 'Something went wrong — please try again.';
}

/* ============================================================
   INIT
   ============================================================ */
async function bootProgress(){
  await loadProgress();
  render();
  renderAuthBar();
  main.dataset.loaded = 'true';
}

function showFatalError(e){
  console.error('Nihongo Daily failed to load:', e);
  main.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="section-title">Couldn't load the app</div>
      <p class="muted" style="margin-top:8px;">${(e && e.message) ? e.message : 'An unexpected error occurred.'}</p>
      <p class="muted" style="margin-top:10px;">Try reloading the page. If this keeps happening, open your browser's developer console (F12 or right-click → Inspect → Console) for the full error, or double-check the FIREBASE_CONFIG values in the file against the setup guide.</p>
    </div></div>
  `;
}

async function init(){
  main.innerHTML = `<div class="empty-state"><div class="glyph">読</div>Loading your progress&hellip;</div>`;
  renderAuthBar();
  if(FIREBASE_READY){
    fbAuth.onAuthStateChanged(async (user)=>{
      try{
        fbUser = user;
        await bootProgress();
      }catch(e){
        showFatalError(e);
      }
    });
  } else {
    try{
      await bootProgress();
    }catch(e){
      showFatalError(e);
    }
  }
}
init();
</script>
